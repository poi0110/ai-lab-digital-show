<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#48b985">
  <title>优莱卫生｜卫生问题及时报</title>
  <style>
    /* ==================== 页面样式：颜色、布局和响应式设计 ==================== */
    :root {
      --green-700: #23785a;
      --green-600: #33966e;
      --green-500: #48b985;
      --green-100: #dff7eb;
      --green-50: #f2fcf7;
      --yellow: #ffd86b;
      --yellow-soft: #fff7d8;
      --orange: #ff9368;
      --red: #ed6b6b;
      --blue: #5b8def;
      --ink: #26352e;
      --muted: #6f7e76;
      --line: #e3eee8;
      --paper: #ffffff;
      --bg: #f4faf6;
      --shadow: 0 14px 35px rgba(43, 109, 78, .12);
      --radius-xl: 26px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 2%, rgba(255, 216, 107, .28), transparent 24rem),
        radial-gradient(circle at 94% 18%, rgba(72, 185, 133, .16), transparent 25rem),
        var(--bg);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    button, input, select, textarea { font: inherit; }
    button { border: 0; }
    button, [role="button"] { touch-action: manipulation; }
    img { display: block; max-width: 100%; }
    .hidden { display: none !important; }

    .app-shell {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 20px clamp(14px, 3vw, 30px) calc(100px + var(--safe-bottom));
    }

    .app-header {
      position: sticky;
      top: 10px;
      z-index: 20;
    }

    .mini-program-bar { display: none; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 72px;
      padding: 12px 14px 12px 18px;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 24px;
      background: rgba(255,255,255,.9);
      box-shadow: 0 8px 28px rgba(43, 109, 78, .10);
      backdrop-filter: blur(14px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      flex: 0 0 46px;
      width: 46px;
      height: 46px;
      place-items: center;
      border-radius: 16px;
      color: white;
      background: linear-gradient(145deg, var(--green-500), var(--green-700));
      box-shadow: 0 8px 18px rgba(72,185,133,.28);
      font-size: 25px;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(19px, 3vw, 25px);
      line-height: 1.05;
      letter-spacing: -.5px;
      white-space: nowrap;
    }

    .brand p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .identity-status {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px;
      border-radius: 16px;
      background: var(--green-50);
    }

    .identity-label {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 42px;
      padding: 0 15px;
      border-radius: 12px;
      color: var(--green-700);
      background: white;
      font-weight: 800;
      white-space: nowrap;
    }

    .identity-exit {
      min-height: 42px;
      padding: 0 13px;
      border-radius: 12px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
    }

    .identity-exit:hover,
    .identity-exit:focus-visible {
      color: var(--green-700);
      background: var(--green-100);
    }

    .identity-gate {
      position: fixed;
      z-index: 500;
      inset: 0;
      display: grid;
      overflow-y: auto;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top, 0px)) 16px max(24px, env(safe-area-inset-bottom, 0px));
      background:
        radial-gradient(circle at 12% 8%, rgba(255, 216, 107, .38), transparent 24rem),
        radial-gradient(circle at 92% 86%, rgba(72, 185, 133, .24), transparent 27rem),
        #f4faf6;
    }

    .identity-gate-card {
      width: min(680px, 100%);
      padding: clamp(26px, 6vw, 48px);
      border: 1px solid rgba(255,255,255,.95);
      border-radius: 32px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 24px 65px rgba(43,109,78,.17);
      text-align: center;
      animation: fadeUp .36s ease both;
    }

    .identity-gate-logo {
      display: grid;
      width: 76px;
      height: 76px;
      margin: 0 auto 16px;
      place-items: center;
      border-radius: 24px;
      color: white;
      background: linear-gradient(145deg, var(--green-500), var(--green-700));
      box-shadow: 0 12px 24px rgba(72,185,133,.28);
      font-size: 38px;
    }

    .identity-gate-card h1 {
      margin: 0;
      font-size: clamp(26px, 6vw, 38px);
      letter-spacing: -1px;
    }

    .identity-gate-card > p {
      margin: 10px auto 22px;
      color: var(--muted);
      line-height: 1.7;
    }

    .identity-role-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 22px;
    }

    .identity-role-card {
      min-height: 178px;
      padding: 23px 16px;
      border: 2px solid transparent;
      border-radius: 22px;
      color: var(--ink);
      background: var(--green-50);
      cursor: pointer;
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    }

    .identity-role-card:hover,
    .identity-role-card:focus-visible {
      border-color: var(--green-500);
      box-shadow: 0 12px 25px rgba(43,109,78,.13);
      transform: translateY(-3px);
    }

    .identity-role-card.manager { background: #fff8df; }
    .identity-role-icon { display: block; margin-bottom: 9px; font-size: 43px; }
    .identity-role-card strong { display: block; font-size: 20px; }
    .identity-role-card small {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .view {
      animation: fadeUp .34s ease both;
    }

    .hero {
      position: relative;
      display: grid;
      grid-template-columns: 1.25fr .75fr;
      gap: 24px;
      overflow: hidden;
      margin-top: 24px;
      padding: clamp(24px, 5vw, 50px);
      border-radius: 32px;
      color: white;
      background: linear-gradient(130deg, #267b5c 0%, #42ad7c 56%, #66cc96 100%);
      box-shadow: var(--shadow);
    }

    .hero::before,
    .hero::after {
      position: absolute;
      content: "";
      border-radius: 50%;
      background: rgba(255,255,255,.10);
    }

    .hero::before { width: 260px; height: 260px; right: -80px; top: -110px; }
    .hero::after { width: 140px; height: 140px; right: 24%; bottom: -85px; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      width: fit-content;
      margin: 0 0 13px;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(255,255,255,.16);
      font-size: 13px;
      font-weight: 800;
    }

    .hero h2 {
      max-width: 650px;
      margin: 0;
      font-size: clamp(27px, 5vw, 48px);
      line-height: 1.16;
      letter-spacing: -1.6px;
    }

    .hero-copy > p {
      max-width: 580px;
      margin: 15px 0 22px;
      color: rgba(255,255,255,.86);
      font-size: clamp(14px, 2vw, 17px);
      line-height: 1.75;
    }

    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; }

    .hero-visual {
      z-index: 1;
      display: grid;
      align-content: center;
      justify-items: center;
      min-height: 205px;
    }

    .clean-mascot {
      position: relative;
      display: grid;
      width: 186px;
      height: 186px;
      place-items: center;
      border: 2px solid rgba(255,255,255,.35);
      border-radius: 50%;
      background: rgba(255,255,255,.14);
      box-shadow: inset 0 0 0 15px rgba(255,255,255,.06);
      font-size: 83px;
      animation: bob 3.2s ease-in-out infinite;
    }

    .spark {
      position: absolute;
      color: var(--yellow);
      font-size: 25px;
      animation: twinkle 1.7s ease-in-out infinite alternate;
    }
    .spark.s1 { left: 0; top: 22px; }
    .spark.s2 { right: 5px; top: 51px; animation-delay: .5s; }
    .spark.s3 { right: 25px; bottom: 7px; animation-delay: .9s; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 14px;
      color: white;
      background: var(--green-600);
      cursor: pointer;
      font-weight: 850;
      transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease;
    }

    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(35,120,90,.2); }
    .btn:active { transform: translateY(0) scale(.98); }
    .btn:focus-visible, .identity-exit:focus-visible, .identity-role-card:focus-visible, .icon-btn:focus-visible, .tab-btn:focus-visible {
      outline: 3px solid rgba(91,141,239,.38);
      outline-offset: 2px;
    }
    .btn:disabled { cursor: not-allowed; opacity: .48; transform: none; box-shadow: none; }
    .btn-light { color: var(--green-700); background: white; }
    .btn-ghost { color: white; border: 1px solid rgba(255,255,255,.5); background: transparent; }
    .btn-soft { color: var(--green-700); background: var(--green-100); }
    .btn-danger-soft { color: #ad4242; background: #fff0f0; }
    .btn-small { min-height: 42px; padding: 0 14px; border-radius: 12px; font-size: 14px; }
    .btn-wide { width: 100%; }

    .section { margin-top: 27px; }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }

    .section-title { margin: 0; font-size: clamp(20px, 3vw, 26px); letter-spacing: -.5px; }
    .section-note { margin: 5px 0 0; color: var(--muted); font-size: 13px; }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .stat-card {
      position: relative;
      overflow: hidden;
      min-width: 0;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--paper);
      box-shadow: 0 8px 22px rgba(43,109,78,.06);
    }

    .stat-card::after {
      position: absolute;
      right: -18px;
      bottom: -22px;
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: var(--accent-soft, var(--green-100));
      content: "";
    }

    .stat-icon {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border-radius: 13px;
      background: var(--accent-soft, var(--green-100));
      font-size: 21px;
    }

    .stat-label { margin: 12px 0 4px; color: var(--muted); font-size: 13px; font-weight: 700; }
    .stat-value { margin: 0; font-size: clamp(24px, 4vw, 34px); font-weight: 900; }
    .stat-tip { margin: 5px 0 0; color: var(--green-700); font-size: 12px; font-weight: 700; }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(260px, .6fr);
      gap: 18px;
    }

    .panel {
      min-width: 0;
      padding: clamp(17px, 3vw, 24px);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      background: var(--paper);
      box-shadow: 0 8px 24px rgba(43,109,78,.055);
    }

    .tabs {
      display: flex;
      gap: 8px;
      max-width: 100%;
      overflow-x: auto;
      padding: 3px 1px 9px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      flex: 0 0 auto;
      min-height: 42px;
      padding: 0 15px;
      border-radius: 13px;
      color: var(--muted);
      background: #f4f7f5;
      cursor: pointer;
      font-weight: 800;
    }
    .tab-btn.active { color: var(--green-700); background: var(--green-100); }

    .task-list { display: grid; gap: 12px; margin-top: 3px; }

    .task-card {
      position: relative;
      overflow: hidden;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .task-card:hover {
      border-color: #bfe3cf;
      box-shadow: 0 9px 22px rgba(43,109,78,.08);
      transform: translateY(-1px);
    }
    .task-card.urgent { border-left: 5px solid var(--orange); }

    .task-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .task-place {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: 17px;
      font-weight: 900;
    }

    .task-meta, .task-desc {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }
    .task-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; margin: 7px 0 0; }
    .task-desc { margin: 11px 0 0; color: #526058; }

    .status {
      flex: 0 0 auto;
      padding: 6px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }
    .status-pending { color: #9a5c15; background: #fff0cc; }
    .status-assigned { color: #3161b1; background: #eaf1ff; }
    .status-cleaning { color: #147c8a; background: #e2f8fb; }
    .status-review { color: #744ab2; background: #f1e9ff; }
    .status-completed { color: #267854; background: #e3f7ed; }
    .status-rework { color: #ad4242; background: #fff0f0; }

    .task-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .progress-line {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 14px;
    }
    .progress-line span { height: 5px; border-radius: 99px; background: #e7efeb; }
    .progress-line span.done { background: var(--green-500); }

    .photo-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 13px;
    }
    .photo-box {
      position: relative;
      display: grid;
      min-height: 105px;
      overflow: hidden;
      place-items: center;
      border: 1px dashed #bfd7ca;
      border-radius: 13px;
      color: var(--muted);
      background: var(--green-50);
      font-size: 12px;
    }
    .photo-box img { width: 100%; height: 105px; object-fit: cover; }
    .photo-label {
      position: absolute;
      left: 7px;
      bottom: 7px;
      padding: 4px 7px;
      border-radius: 8px;
      color: white;
      background: rgba(38,53,46,.72);
      font-size: 11px;
      font-weight: 700;
    }

    .checkin-card {
      overflow: hidden;
      padding: 20px;
      border-radius: 22px;
      background: linear-gradient(145deg, var(--yellow-soft), #fff);
      box-shadow: inset 0 0 0 1px #f5e8ac;
    }

    .clock { margin: 6px 0 2px; font-size: clamp(32px, 7vw, 47px); font-weight: 950; letter-spacing: -1px; }
    .date-line { margin: 0 0 16px; color: var(--muted); font-size: 13px; }

    .score-ring {
      position: relative;
      display: grid;
      width: 160px;
      height: 160px;
      margin: 10px auto 16px;
      place-items: center;
      border-radius: 50%;
      background: conic-gradient(var(--green-500) var(--score), #eaf2ed 0);
    }
    .score-ring::after {
      position: absolute;
      width: 124px;
      height: 124px;
      border-radius: 50%;
      background: white;
      content: "";
    }
    .score-inner { z-index: 1; text-align: center; }
    .score-inner strong { display: block; font-size: 42px; line-height: 1; }
    .score-inner span { color: var(--muted); font-size: 12px; }

    .reward-list { display: grid; gap: 8px; }
    .reward-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 12px;
      border-radius: 13px;
      background: #f6faf7;
      font-size: 13px;
    }
    .reward-item.current { color: var(--green-700); background: var(--green-100); font-weight: 850; }

    .report-list { display: grid; gap: 10px; }
    .report-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 13px;
      border-radius: 15px;
      background: #f7faf8;
    }
    .report-icon { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 12px; background: white; font-size: 20px; }
    .report-row strong { display: block; font-size: 14px; }
    .report-row small { color: var(--muted); font-size: 12px; }
    .report-num { color: var(--green-700); font-size: 18px; font-weight: 900; }

    .empty {
      padding: 34px 16px;
      border: 1px dashed #cfe1d7;
      border-radius: 18px;
      color: var(--muted);
      background: var(--green-50);
      text-align: center;
    }
    .empty-icon { display: block; margin-bottom: 8px; font-size: 43px; }
    .empty strong { display: block; margin-bottom: 5px; color: var(--ink); }

    .bottom-nav {
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: calc(12px + var(--safe-bottom));
      display: none;
      width: calc(100% - 24px);
      max-width: 520px;
      padding: 7px;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 20px;
      background: rgba(255,255,255,.94);
      box-shadow: 0 10px 30px rgba(38,53,46,.16);
      backdrop-filter: blur(14px);
      transform: translateX(-50%);
    }
    .nav-btn {
      flex: 1;
      min-height: 51px;
      border-radius: 14px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
    }
    .nav-btn span { display: block; margin-bottom: 2px; font-size: 19px; }
    .nav-btn b { display: block; font-size: 12px; font-weight: 800; }
    .nav-btn.active { color: var(--green-700); background: var(--green-100); }

    .modal-backdrop {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: grid;
      overflow-y: auto;
      place-items: center;
      padding: 18px;
      background: rgba(24,43,34,.46);
      backdrop-filter: blur(7px);
      animation: fade .2s ease;
    }

    .modal {
      width: min(540px, 100%);
      max-height: min(780px, calc(100vh - 36px));
      overflow-y: auto;
      padding: clamp(20px, 4vw, 28px);
      border-radius: 26px;
      background: white;
      box-shadow: 0 25px 70px rgba(23,62,44,.25);
      animation: modalIn .25s ease both;
    }

    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; }
    .modal h3 { margin: 0; font-size: 23px; }
    .modal-sub { margin: 7px 0 20px; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .icon-btn {
      display: grid;
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 13px;
      color: var(--muted);
      background: #f2f6f3;
      cursor: pointer;
      font-size: 19px;
    }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    .field { min-width: 0; margin-bottom: 13px; }
    .field.full { grid-column: 1 / -1; }
    .field label { display: block; margin: 0 0 7px; font-size: 13px; font-weight: 850; }
    .field input, .field select, .field textarea {
      width: 100%;
      min-height: 48px;
      border: 1px solid #cfddd5;
      border-radius: 13px;
      outline: 0;
      color: var(--ink);
      background: white;
      padding: 11px 12px;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .field textarea { min-height: 95px; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--green-500);
      box-shadow: 0 0 0 4px rgba(72,185,133,.12);
    }
    .field-hint { margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .error-text { display: none; margin: 6px 0 0; color: var(--red); font-size: 12px; font-weight: 700; }
    .field.invalid .error-text { display: block; }
    .field.invalid input, .field.invalid textarea, .field.invalid select { border-color: var(--red); }

    .upload-box {
      display: grid;
      min-height: 112px;
      overflow: hidden;
      place-items: center;
      border: 2px dashed #bddbca;
      border-radius: 15px;
      color: var(--green-700);
      background: var(--green-50);
      cursor: pointer;
      text-align: center;
    }
    .upload-box input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .upload-box .upload-icon { display: block; margin-bottom: 4px; font-size: 28px; }
    .upload-preview { width: 100%; height: 150px; object-fit: cover; }

    .welcome-steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 18px 0;
    }
    .welcome-step {
      padding: 14px 10px;
      border-radius: 16px;

<script id="ai-lab-responsive-runtime">
(() => {
  const root = document.documentElement;
  const mobileUa = /Android|webOS|iPhone|iPad|iPod|Mobile|IEMobile|Opera Mini/i.test(navigator.userAgent || "");
  const coarsePointer = window.matchMedia?.("(hover: none) and (pointer: coarse)")?.matches || false;
  const updateLayoutMode = () => {
    const narrowScreen = window.innerWidth <= 768;
    const touchTablet = coarsePointer && window.innerWidth <= 1024;
    const mobileDevice = mobileUa && window.innerWidth <= 1180;
    const useH5 = narrowScreen || touchTablet || mobileDevice;
    root.classList.toggle("ai-lab-h5", useH5);
    root.classList.toggle("ai-lab-web", !useH5);
    root.dataset.layoutMode = useH5 ? "h5" : "web";
  };
  updateLayoutMode();
  window.addEventListener("resize", updateLayoutMode, { passive: true });
  window.addEventListener("orientationchange", updateLayoutMode, { passive: true });
})();
</script>

  <script>
    "use strict";

    /* ==================== 修改内容：可在这里快速修改产品基础文字 ==================== */
    const CONFIG = {
      productName: "优莱卫生",
      cleanerName: "小优",
      managerName: "王主管",
      baseSalary: 3200,
      buildingFloors: [1, 2, 3, 4, 5],

    const STATUS = {
      pending: { text: "待分配", className: "status-pending", step: 1 },
      assigned: { text: "待接单", className: "status-assigned", step: 1 },
      cleaning: { text: "正在打扫", className: "status-cleaning", step: 2 },
      review: { text: "等待验收", className: "status-review", step: 3 },
      completed: { text: "已完成", className: "status-completed", step: 4 },
      rework: { text: "需要返工", className: "status-rework", step: 2 }

    function normalizeFloors(floors) {
      const valid = new Set(CONFIG.buildingFloors);
      return [...new Set(Array.isArray(floors) ? floors.map(Number).filter(floor => valid.has(floor)) : [])]
        .sort((a, b) => a - b);
    }

    function inferFloorsFromArea(area = "") {
      const text = String(area);
      const chineseNumbers = { 1: "一", 2: "二", 3: "三", 4: "四", 5: "五" };
      return CONFIG.buildingFloors.filter(floor =>
        text.includes(`${floor}楼`) || text.includes(chineseNumbers[floor])
      );
    }

    function formatFloors(floors, emptyText = "尚未选择负责楼层") {
      const normalized = normalizeFloors(floors);
      return normalized.length ? normalized.map(floor => `${floor}楼`).join("、") : emptyText;
    }

    function makeInitialState() {
      const now = Date.now();
      return {
        version: 5,
        role: "",
        identityChosen: false,
        currentFilter: "all",
        selectedCleanerId: "cleaner_001",
        cleaners: [

            urgent: true,
            status: "assigned",
            assignedTo: CONFIG.cleanerName,
            assignedCleanerId: "cleaner_001",
            createdAt: now - 38 * 60 * 1000,
            updatedAt: now - 38 * 60 * 1000,
            beforeImage: "",
            afterImage: "",
            remark: ""
          },
          {
            id: "task_" + (now - 2),
            location: "二楼美术室",
            category: "教室",
            description: "课程结束后有纸屑，请清扫地面并整理垃圾桶。",
            urgent: false,
            status: "cleaning",
            assignedTo: CONFIG.cleanerName,
            assignedCleanerId: "cleaner_001",
            createdAt: now - 90 * 60 * 1000,
            updatedAt: now - 25 * 60 * 1000,
            beforeImage: "",
            afterImage: "",
            remark: ""
          },
          {
            id: "task_" + (now - 1),
            location: "东区电梯间",
            category: "公共区域",
            description: "电梯门有手印，角落有少量灰尘。",
            urgent: false,
            status: "completed",
            assignedTo: "小洁",
            assignedCleanerId: "cleaner_002",
            createdAt: now - 26 * 60 * 60 * 1000,
            updatedAt: now - 22 * 60 * 60 * 1000,
            beforeImage: "",
            afterImage: "",
            remark: "验收合格"
          }
        ],
        notices: [
          { id: "n1", text: "东区电梯间已验收，信用分 +1", time: now - 22 * 60 * 60 * 1000 }
        ],
        scoreLogs: [
          {
            id: "score_seed_1",
            cleanerId: "cleaner_002",
            cleanerName: "小洁",
            delta: 1,
            before: 6,
            after: 7,
            reason: "东区电梯间验收通过",
            source: "任务验收",
            operator: "王主管",
            time: now - 22 * 60 * 60 * 1000
          }
        ]
      };
    }

    /* ==================== 数据保存：使用 localStorage 保存和恢复数据 ==================== */
    function loadState() {
      try {
        const saved = localStorage.getItem(CONFIG.storageKey);
        if (!saved) return makeInitialState();
        const parsed = JSON.parse(saved);
        if (!parsed || !Array.isArray(parsed.tasks)) throw new Error("数据格式错误");
        return migrateState(parsed);
      } catch (error) {
        console.warn("读取保存数据失败，已恢复默认数据：", error);
        return makeInitialState();
      }
    }

    function migrateState(parsed) {
      const initial = makeInitialState();
      const sourceVersion = Number(parsed.version) || 1;
      const migrated = { ...initial, ...parsed, version: 5 };

      // 修改内容：旧版本升级后只显示一次身份选择；选择结果会长期保存。
      migrated.role = ["cleaner", "manager"].includes(parsed.role) ? parsed.role : "";
      migrated.identityChosen = sourceVersion >= 3 && parsed.identityChosen === true && Boolean(migrated.role);

      // 兼容旧版本的单一保洁员数据，升级后不丢失信用分和打卡记录。
      if (!Array.isArray(parsed.cleaners) || !parsed.cleaners.length) {
        const legacy = parsed.cleaner || initial.cleaners[0];
        migrated.cleaners = [{
          id: "cleaner_001",
          name: legacy.name || CONFIG.cleanerName,
          employeeNo: legacy.employeeNo || "YL001",
          area: legacy.area || "未设置负责区域",
          floors: normalizeFloors(legacy.floors || inferFloorsFromArea(legacy.area)),
          phone: legacy.phone || "",
          credit: Number.isFinite(legacy.credit) ? legacy.credit : 8,
          completed: Number.isFinite(legacy.completed) ? legacy.completed : 0,
          attendance: Array.isArray(legacy.attendance) ? legacy.attendance : []
        }];
      }

      migrated.cleaners = migrated.cleaners.map((cleaner, index) => ({
        id: cleaner.id || `cleaner_${Date.now()}_${index}`,
        name: cleaner.name || `保洁员${index + 1}`,
        employeeNo: cleaner.employeeNo || `YL${String(index + 1).padStart(3, "0")}`,
        area: cleaner.area || "未设置负责区域",
        floors: normalizeFloors(cleaner.floors || inferFloorsFromArea(cleaner.area)),
        phone: cleaner.phone || "",
        credit: Number.isFinite(cleaner.credit) ? cleaner.credit : 8,
        completed: Number.isFinite(cleaner.completed) ? cleaner.completed : 0,
        attendance: (Array.isArray(cleaner.attendance) ? cleaner.attendance : []).map(item => ({
          ...item,
          evidenceData: item.evidenceData || "",
          evidenceType: item.evidenceType || "",
          evidenceName: item.evidenceName || ""
        }))
      }));

      migrated.scoreLogs = Array.isArray(parsed.scoreLogs) ? parsed.scoreLogs.map(log => ({
        id: log.id || `score_${Date.now()}_${Math.random().toString(16).slice(2)}`,
        cleanerId: log.cleanerId || "",
        cleanerName: log.cleanerName || "未知人员",
        delta: Number(log.delta) || 0,
        before: Number.isFinite(log.before) ? log.before : 0,
        after: Number.isFinite(log.after) ? log.after : 0,
        reason: log.reason || "未填写原因",
        source: log.source || "其他",
        operator: log.operator || CONFIG.managerName,
        time: Number(log.time) || Date.now()
      })) : [];

      migrated.selectedCleanerId = migrated.cleaners.some(item => item.id === parsed.selectedCleanerId)
        ? parsed.selectedCleanerId
        : migrated.cleaners[0].id;

      migrated.tasks = parsed.tasks.map(task => {
        const matched = migrated.cleaners.find(cleaner =>
          cleaner.id === task.assignedCleanerId || cleaner.name === task.assignedTo
        );
        return {
          ...task,
          assignedCleanerId: matched ? matched.id : "",
          assignedTo: matched ? matched.name : (task.assignedTo || "")
        };
      });

      delete migrated.cleaner;
      delete migrated.firstVisit;
      return migrated;
    }

    let state = loadState();
    let currentModalPhoto = "";
    let currentAttendanceEvidence = { data: "", type: "", name: "" };
    let clockTimer = null;

    function saveState() {
      try {
        localStorage.setItem(CONFIG.storageKey, JSON.stringify(state));
      } catch (error) {
        showToast("保存失败：图片可能太大，请换一张较小的图片", "error");
      }
    }

    function resetData() {
      const ok = window.confirm("确定要清空所有操作记录并重新开始吗？此操作不能撤销。");
      if (!ok) return;
      state = makeInitialState();
      saveState();
      closeModal();
      renderApp();
      showToast("已恢复初始示例，可以重新体验", "success");
    }

    /* ==================== 核心功能：页面渲染、任务流转、打卡、验收与反馈 ==================== */
    const escapeHTML = (value = "") => String(value).replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
    }[char]));

    function normalizePhone(value = "") {
      return String(value).replace(/\D/g, "").slice(0, 11);
    }

    function isValidPhone(value) {
      return /^1\d{10}$/.test(normalizePhone(value));
    }

    function maskPhone(value) {
      const phone = normalizePhone(value);
      return isValidPhone(phone) ? `${phone.slice(0, 3)}****${phone.slice(7)}` : "未填写手机号";
    }

    function formatTime(timestamp) {
      const date = new Date(timestamp);
      const today = new Date();
      const sameDay = date.toDateString() === today.toDateString();
      const prefix = sameDay ? "今天" : `${date.getMonth() + 1}月${date.getDate()}日`;
      return `${prefix} ${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
    }

    function todayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function checkinStartMinutes() {
      return CONFIG.checkinStartHour * 60 + CONFIG.checkinStartMinute;
    }

    function canCheckInNow() {
      // 修改内容：允许保洁在9:00前提前打卡，不再限制打卡开始时间
      return true;
    }

    function isLateCheckin(date = new Date()) {
      return date.getHours() * 60 + date.getMinutes() > checkinStartMinutes();
    }

    function getCurrentCleaner() {
      return state.cleaners.find(item => item.id === state.selectedCleanerId) || state.cleaners[0];
    }

    function getCleanerById(id) {
      return state.cleaners.find(item => item.id === id);
    }

    function getAssignedCleaner(task) {
      return getCleanerById(task.assignedCleanerId) ||
        state.cleaners.find(item => item.name === task.assignedTo);
    }

    function getTodayAttendance(cleaner = getCurrentCleaner()) {
      return cleaner?.attendance.find(item => item.date === todayKey());
    }

    function getBonus(credit = getCurrentCleaner().credit) {
      if (credit >= 9) return 50;
      if (credit === 8) return 40;
      if (credit === 7) return 30;
      if (credit === 6) return 20;
      return 0;
    }

    function minutesAfterCheckinStart(date = new Date()) {
      return Math.max(0, date.getHours() * 60 + date.getMinutes() - checkinStartMinutes());
    }

    function attendanceStatusText(attendance) {
      if (!attendance) return "未打卡";
      if (attendance.status === "late") return `迟到 ${attendance.lateMinutes || 1} 分钟`;
      return "准时打卡";
    }

    function getTodayReminder(cleaner = getCurrentCleaner()) {
      const attendance = getTodayAttendance(cleaner);
      const activeCount = taskCount(["assigned", "cleaning", "rework"], cleaner.id);
      const reviewCount = taskCount(["review"], cleaner.id);
      const now = new Date();
      if (!attendance) {
        if (isLateCheckin(now)) {
          return { level: "danger", icon: "⏰", title: `你已迟到 ${minutesAfterCheckinStart(now)} 分钟`, text: "请立即上传现场照片或短视频完成打卡；迟到将按公开规则扣 1 分。" };
        }
        return { level: "warning", icon: "📸", title: "今日还未打卡", text: "请在 9:00 前上传现场照片或短视频，完成到岗证明。" };
      }
      if (attendance.status === "late") {
        return { level: "danger", icon: "⏰", title: `今日迟到 ${attendance.lateMinutes || 1} 分钟`, text: "迟到记录和扣分原因已公开保存，可在奖惩记录中查看。" };
      }
      if (activeCount) return { level: "info", icon: "🧹", title: `还有 ${activeCount} 个任务待处理`, text: "首页已按紧急程度排列，先完成标有“紧急”的任务。" };
      if (reviewCount) return { level: "info", icon: "🔍", title: `${reviewCount} 个任务等待验收`, text: "整改结果已提交，主管验收后会自动更新奖励。" };
      return { level: "success", icon: "✅", title: "今日任务已完成", text: "打卡和任务记录均已保存，辛苦了！" };
    }

    function managerReminder() {
      const now = new Date();
      const review = taskCount(["review"]);
      const missing = isLateCheckin(now) ? state.cleaners.filter(cleaner => !getTodayAttendance(cleaner)).length : 0;
      const late = state.cleaners.filter(cleaner => getTodayAttendance(cleaner)?.status === "late").length;
      if (review) return { level: "warning", icon: "🔍", title: `${review} 个任务等待验收`, text: "请查看整改凭证，并按公开标准选择通过或返工。" };
      if (missing) return { level: "danger", icon: "⏰", title: `${missing} 人超过 9:00 仍未打卡`, text: "系统已标记异常，请及时联系并确认到岗情况。" };
      if (late) return { level: "warning", icon: "📋", title: `今日有 ${late} 人迟到`, text: "迟到分钟数、打卡凭证和扣分记录均可查询。" };
      return { level: "success", icon: "✅", title: "当前没有紧急异常", text: "任务、打卡和奖惩记录均正常。" };
    }

    function reminderBanner(reminder) {
      return `<section class="alert-banner ${reminder.level}" role="status">
        <span class="alert-icon">${reminder.icon}</span>
        <div><strong>${escapeHTML(reminder.title)}</strong><p>${escapeHTML(reminder.text)}</p></div>
      </section>`;
    }

    function recordScoreChange(cleaner, delta, reason, source = "其他", operator = CONFIG.managerName) {
      if (!cleaner) return { before: 0, after: 0, applied: 0 };
      const before = Number(cleaner.credit) || 0;
      const after = Math.max(0, before + Number(delta || 0));
      const applied = after - before;
      cleaner.credit = after;
      state.scoreLogs = Array.isArray(state.scoreLogs) ? state.scoreLogs : [];
      state.scoreLogs.unshift({
        id: "score_" + Date.now() + "_" + Math.random().toString(16).slice(2),
        cleanerId: cleaner.id,
        cleanerName: cleaner.name,
        delta: applied,
        before,
        after,
        reason,
        source,
        operator,
        time: Date.now()
      });
      state.scoreLogs = state.scoreLogs.slice(0, 100);
      return { before, after, applied };
    }

    function rewardRulesPanel(compact = false) {
      return `<div class="rules-card ${compact ? "compact" : ""}">
        <div class="section-head"><div><h2 class="section-title" style="font-size:20px">公开奖惩标准</h2><p class="section-note">同一标准适用于所有保洁员，每次变化必须写明原因</p></div></div>
        <div class="rules-grid">
          <div class="rule-item reward"><span>＋1</span><div><strong>任务验收通过</strong><small>整改结果达到要求，主管确认通过</small></div></div>
          <div class="rule-item penalty"><span>－1</span><div><strong>任务需要返工</strong><small>主管必须填写具体返工原因</small></div></div>
          <div class="rule-item penalty"><span>－1</span><div><strong>9:00 后打卡</strong><small>显示迟到分钟数，并保留照片或视频凭证</small></div></div>
          <div class="rule-item neutral"><span>必填</span><div><strong>奖惩原因公开</strong><small>显示人员、时间、原因、变动前后分数和操作人</small></div></div>
        </div>
      </div>`;
    }

    function renderScoreLedger(cleanerId = "", limit = 8) {
      const logs = (Array.isArray(state.scoreLogs) ? state.scoreLogs : [])
        .filter(log => !cleanerId || log.cleanerId === cleanerId)
        .slice(0, limit);
      if (!logs.length) return `<div class="empty"><span class="empty-icon">📒</span><strong>还没有奖惩记录</strong><span>打卡或任务验收后会自动生成公开记录。</span></div>`;
      return `<div class="score-ledger">${logs.map(log => {
        const deltaClass = log.delta > 0 ? "plus" : log.delta < 0 ? "minus" : "zero";
        const deltaText = log.delta > 0 ? `+${log.delta}` : String(log.delta);
        return `<article class="ledger-row">
          <div class="ledger-delta ${deltaClass}">${deltaText}</div>
          <div class="ledger-main"><strong>${escapeHTML(log.cleanerName)}｜${escapeHTML(log.reason)}</strong><small>${escapeHTML(log.source)} · ${formatTime(log.time)} · 操作人：${escapeHTML(log.operator)}</small></div>
          <div class="ledger-score">${log.before} → ${log.after}</div>
        </article>`;
      }).join("")}</div>`;
    }

    function taskCount(statuses, cleanerId = "") {
      return state.tasks.filter(task =>
        statuses.includes(task.status) && (!cleanerId || task.assignedCleanerId === cleanerId)
      ).length;
    }

    function requestRole(role) {
      if (role === "manager") {
        openManagerLoginModal();
        return;
      }
      setRole(role);
    }

    function setRole(role) {
      if (!["cleaner", "manager"].includes(role)) return;
      state.role = role;
      state.identityChosen = true;
      state.currentFilter = "all";
      saveState();
      closeModal();
      renderApp();
      showToast(role === "cleaner" ? "已进入保洁员工作台" : "主管身份验证成功", "info");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openManagerLoginModal() {
      openModal(`
        <div class="modal-head"><div><h3>主管身份验证</h3><p class="modal-sub">主管可以发布任务、查看打卡凭证和修改奖惩记录，请输入主管密码。</p></div><button class="icon-btn" data-close-modal type="button" aria-label="关闭">✕</button></div>
        <form id="managerLoginForm">
          <div class="field" id="managerPasswordField">
            <label for="managerPassword">主管密码 *</label>
            <input id="managerPassword" type="password" inputmode="numeric" maxlength="12" autocomplete="current-password" placeholder="请输入主管密码">
            <p class="error-text">密码不正确，请重新输入</p>
          </div>
          <button class="btn btn-wide" type="submit">验证并进入主管端</button>
        </form>
      `);
      const input = document.getElementById("managerPassword");
      input.focus();
      document.getElementById("managerLoginForm").addEventListener("submit", event => {
        event.preventDefault();

        document.getElementById("managerPasswordField").classList.toggle("invalid", !valid);

      });

    function openExitIdentityModal() {
      const roleText = state.role === "manager" ? "主管" : "保洁员";
      openModal(`
        <div style="text-align:center;font-size:52px;margin-bottom:10px" aria-hidden="true">🚪</div>
        <h3 style="text-align:center">切换当前身份？</h3>

    function clearIdentityChoice(targetState) {
      targetState.identityChosen = false;
      targetState.role = "";
      targetState.currentFilter = "all";
      return targetState;
    }

    function exitIdentity() {
      clearIdentityChoice(state);
      saveState();
      closeModal();
      renderApp();
      showToast("请选择要进入的身份", "info");
      window.scrollTo({ top: 0, behavior: "smooth" });

    function renderApp() {
      const identityGate = document.getElementById("identityGate");
      const appShell = document.getElementById("appShell");
      const bottomNav = document.getElementById("bottomNav");
      const identityReady = state.identityChosen && ["cleaner", "manager"].includes(state.role);

      identityGate.classList.toggle("hidden", identityReady);
      appShell.classList.toggle("hidden", !identityReady);
      bottomNav.classList.toggle("hidden", !identityReady);
      document.body.style.overflow = identityReady ? "" : "hidden";

      if (!identityReady) {
        document.getElementById("mainContent").innerHTML = "";
        return;
      }

      const managerMode = state.role === "manager";
      document.getElementById("currentRoleIcon").textContent = managerMode ? "📋" : "🧹";
      document.getElementById("currentRoleText").textContent = managerMode ? "主管" : "保洁员";

      const thirdNav = document.getElementById("thirdNavButton");
      const thirdNavIcon = document.getElementById("thirdNavIcon");
      const thirdNavText = document.getElementById("thirdNavText");
      if (thirdNav && thirdNavIcon && thirdNavText) {
        thirdNav.dataset.scroll = managerMode ? "personnelSection" : "scoreSection";
        thirdNavIcon.textContent = managerMode ? "👥" : "⭐";
        thirdNavText.textContent = managerMode ? "人员" : "信用";

      root.innerHTML = state.role === "manager" ? managerView() : cleanerView();
      bindDynamicActions();
      startClock();
    }

      const averageCredit = state.cleaners.length ? (state.cleaners.reduce((sum, cleaner) => sum + cleaner.credit, 0) / state.cleaners.length).toFixed(1) : "0";
      const reminder = managerReminder();

      return `
        <section class="home-hero compact-hero manager-home">
          <div><p class="eyebrow">📋 ${escapeHTML(CONFIG.managerName)}的主管工作台</p><h2>${review ? `${review} 个任务等待验收` : "任务、人员和奖惩一页看清"}</h2><p>首页重点显示任务进度、异常提醒和团队奖励，其他管理功能放到下方。</p></div>

          <article class="focus-card reward-focus"><span>⭐</span><div><small>团队信用</small><strong>${averageCredit} 分</strong><p>公开记录 ${state.scoreLogs?.length || 0} 条</p></div></article>
        </section>

        <section class="section panel priority-panel" id="taskSection">
          <div class="section-head"><div><h2 class="section-title">工作任务与验收</h2><p class="section-note">发布、分配、查看整改凭证和验收都在这里完成</p></div><button class="btn btn-small" data-action="new-task" type="button">＋ 新任务</button></div>
          ${renderTaskTabs("manager")}
          <div class="task-list">${renderTaskList("manager")}</div>
        </section>

        <section class="section content-grid">
          <div class="panel" id="personnelSection">
            <div class="section-head"><div><h2 class="section-title">保洁人员与打卡凭证</h2><p class="section-note">可查看负责楼层、打卡状态、迟到分钟数和现场凭证</p></div><button class="btn btn-small" data-action="new-cleaner" type="button">＋ 录入</button></div>
            ${renderPersonnelList()}

            <div class="panel" id="scoreSection">
              <div class="section-head"><div><h2 class="section-title" style="font-size:20px">公开奖惩记录</h2><p class="section-note">记录不可隐藏，必须写明原因</p></div><button class="btn btn-small" data-action="manual-score" type="button">＋ 记录奖惩</button></div>
              ${renderScoreLedger("", 10)}

              <div class="report-row"><div class="report-icon">🧹</div><div><strong>处理中</strong><small>保洁员正在跟进</small></div><span class="report-num">${working}</span></div>
              <div class="report-row"><div class="report-icon">⚡</div><div><strong>未完成紧急任务</strong><small>需要优先处理</small></div><span class="report-num">${state.tasks.filter(t => t.urgent && t.status !== "completed").length}</span></div>
              <div class="report-row"><div class="report-icon">✅</div><div><strong>已完成任务</strong><small>全部历史记录</small></div><span class="report-num">${completed}</span></div>
            </div>
            <div class="settings-row"><button class="btn btn-small btn-soft" data-action="open-help" type="button">❓ 流程说明</button><button class="btn btn-small btn-danger-soft" data-action="reset" type="button">↻ 重新开始</button></div>
          </div>
        </details>
      `;

    function statCard(icon, label, value, tip, soft) {
      return `
        <article class="stat-card" style="--accent-soft:${soft}">
          <div class="stat-icon">${icon}</div>
          <p class="stat-label">${label}</p>
          <p class="stat-value">${value}</p>
          <p class="stat-tip">${tip}</p>
        </article>`;
    }

    function renderPersonnelList() {
      if (!state.cleaners.length) {
        return `<div class="empty"><span class="empty-icon">👤</span><strong>还没有保洁人员</strong><span>点击“录入”添加第一位保洁员。</span></div>`;
      }
      return `<div class="person-grid">${state.cleaners.map(cleaner => {
        const attendance = getTodayAttendance(cleaner);
        const active = taskCount(["assigned", "cleaning", "rework"], cleaner.id);
        return `
          <article class="person-card">
            <div class="person-head">
              <div class="person-avatar">🧹</div>
              <div><h3>${escapeHTML(cleaner.name)}</h3><small>工号 ${escapeHTML(cleaner.employeeNo)}</small></div>
            </div>
            <p class="person-area">🏢 负责楼层：${escapeHTML(formatFloors(cleaner.floors, cleaner.area || "尚未选择"))}</p>
            <p class="person-phone"><span>📱 ${maskPhone(cleaner.phone)}</span></p>
            <div class="person-stats">
              <span>信用 ${cleaner.credit} 分</span>
              <span>任务 ${active} 个</span>
              <span>工资 ${CONFIG.baseSalary + getBonus(cleaner.credit)} 元</span>
              <span>${attendance ? attendanceStatusText(attendance) : "今日未打卡"}</span>
            </div>
            <div class="person-actions">
              ${attendance ? `<button class="btn btn-small btn-soft" data-view-attendance="${cleaner.id}" type="button">📸 查看打卡凭证</button>` : `<button class="btn btn-small btn-danger-soft" disabled type="button">⏰ 尚未打卡</button>`}
              ${isValidPhone(cleaner.phone)
                ? `<a class="btn btn-small" href="tel:${normalizePhone(cleaner.phone)}" aria-label="拨打${escapeHTML(cleaner.name)}的电话">☎️ 一键拨打</a>`
                : `<p class="mini-note" style="width:100%;margin:0">等待${escapeHTML(cleaner.name)}本人填写手机号</p>`}
            </div>
          </article>`;
      }).join("")}</div>`;

    function renderTaskTabs(role) {
      const filters = role === "manager"
        ? [["all", "全部"], ["pending", "待分配"], ["working", "处理中"], ["review", "待验收"], ["completed", "已完成"]]
        : [["all", "全部"], ["todo", "待处理"], ["review", "待验收"], ["completed", "已完成"]];

      return `<div class="tabs" role="tablist">${filters.map(([key, label]) =>
        `<button class="tab-btn ${state.currentFilter === key ? "active" : ""}" data-filter="${key}" type="button" role="tab" aria-selected="${state.currentFilter === key}">${label}</button>`
      ).join("")}</div>`;
    }

    function filteredTasks(role) {
      const filter = state.currentFilter;
      let tasks = [...state.tasks].sort((a, b) => {
        if (a.urgent !== b.urgent) return a.urgent ? -1 : 1;
        return b.updatedAt - a.updatedAt;
      });
      if (role === "cleaner") {
        tasks = tasks.filter(task => task.assignedCleanerId === getCurrentCleaner().id);
      }
      if (filter === "all") return tasks;
      if (filter === "working") return tasks.filter(t => ["assigned", "cleaning", "rework"].includes(t.status));
      if (filter === "todo") return tasks.filter(t => ["assigned", "cleaning", "rework"].includes(t.status));
      return tasks.filter(t => t.status === filter);
    }

    function renderTaskList(role) {
      const tasks = filteredTasks(role);
      if (!tasks.length) {
        return `<div class="empty"><span class="empty-icon">🌿</span><strong>这里暂时没有任务</strong><span>${role === "manager" ? "可以点击“发布卫生任务”新增一项。" : "切换其他分类看看，或稍后再来。"}</span></div>`;
      }
      return tasks.map(task => renderTaskCard(task, role)).join("");
    }

    function renderTaskCard(task, role) {
      const status = STATUS[task.status] || STATUS.pending;
      const actions = role === "manager" ? managerTaskActions(task) : cleanerTaskActions(task);
      const photoBlock = (task.beforeImage || task.afterImage) ? `
        <div class="photo-pair">
          <div class="photo-box">${task.beforeImage ? `<img src="${task.beforeImage}" alt="清洁前照片">` : "未上传清洁前照片"}<span class="photo-label">清洁前</span></div>
          <div class="photo-box">${task.afterImage ? `<img src="${task.afterImage}" alt="整改完成照片">` : "等待上传整改图"}<span class="photo-label">整改后</span></div>
        </div>` : "";

      return `
        <article class="task-card ${task.urgent && task.status !== "completed" ? "urgent" : ""}">
          <div class="task-top">
            <div>
              <h3 class="task-place">${task.urgent && task.status !== "completed" ? "🔥 " : ""}${escapeHTML(task.location)}</h3>
              <div class="task-meta">
                <span>🏷️ ${escapeHTML(task.category)}</span>
                <span>🕒 ${formatTime(task.createdAt)}</span>
                ${task.assignedTo ? `<span>👤 ${escapeHTML(task.assignedTo)}</span>` : ""}
              </div>
            </div>
            <span class="status ${status.className}">${status.text}</span>
          </div>
          <p class="task-desc">${escapeHTML(task.description)}</p>
          ${task.remark ? `<p class="mini-note">💬 主管留言：${escapeHTML(task.remark)}</p>` : ""}
          ${photoBlock}
          <div class="progress-line" aria-label="任务完成进度">${[1,2,3,4].map(n => `<span class="${n <= status.step ? "done" : ""}"></span>`).join("")}</div>
          ${actions ? `<div class="task-actions">${actions}</div>` : ""}
        </article>`;
    }

    function cleanerTaskActions(task) {
      if (task.status === "assigned") return `<button class="btn btn-small" data-task-action="accept" data-id="${task.id}" type="button">🙋 接受任务</button>`;
      if (task.status === "cleaning") return `<button class="btn btn-small" data-task-action="complete" data-id="${task.id}" type="button">📷 完成并上传整改图</button>`;
      if (task.status === "rework") return `<button class="btn btn-small" data-task-action="complete" data-id="${task.id}" type="button">🔁 重新提交整改图</button>`;
      if (task.status === "review") return `<button class="btn btn-small btn-soft" disabled type="button">⏳ 等待主管验收</button>`;
      if (task.status === "completed") return `<button class="btn btn-small btn-soft" disabled type="button">✅ 已通过验收</button>`;
      return "";
    }

    function managerTaskActions(task) {
      if (task.status === "pending") return `<button class="btn btn-small" data-task-action="assign" data-id="${task.id}" type="button">👤 选择人员并分配</button>`;
      if (task.status === "review") return `
        <button class="btn btn-small" data-task-action="approve" data-id="${task.id}" type="button">✅ 验收通过</button>
        <button class="btn btn-small btn-danger-soft" data-task-action="rework" data-id="${task.id}" type="button">↩ 要求返工</button>`;
      if (task.status === "completed") return `<button class="btn btn-small btn-soft" disabled type="button">已完成闭环</button>`;
      return `<button class="btn btn-small btn-soft" disabled type="button">${task.status === "assigned" ? "等待保洁员接单" : "保洁员处理中"}</button>`;
    }

    function scorePanel(cleaner = getCurrentCleaner()) {
      const credit = cleaner.credit;
      const bonus = getBonus(credit);
      const tiers = [[6, 20], [7, 30], [8, 40], [9, 50]];
      return `
        <div class="section-head">
          <div>
            <h2 class="section-title" style="font-size:20px">${escapeHTML(cleaner.name)}的信用奖励</h2>
            <p class="section-note">验收通过 +1 分，主管要求返工 -1 分</p>
          </div>
        </div>
        <div class="score-ring" style="--score:${Math.min(100, credit * 10)}%">
          <div class="score-inner"><strong>${credit}</strong><span>当前信用分</span></div>
        </div>
        <div class="reward-list">
          ${tiers.map(([score, money]) => `<div class="reward-item ${credit === score || (score === 9 && credit >= 9) ? "current" : ""}"><span>${score}${score === 9 ? " 分及以上" : " 分"}</span><strong>工资 +${money} 元</strong></div>`).join("")}
        </div>
        <p class="mini-note" style="margin:12px 0 0">本月预计：基础工资 ${CONFIG.baseSalary} 元 + 信用奖励 ${bonus} 元 = <strong>${CONFIG.baseSalary + bonus} 元</strong></p>`;
    }

    function renderNotices() {
      if (!state.notices.length) return `<div class="empty"><span class="empty-icon">🔔</span><strong>还没有新反馈</strong><span>完成任务后，反馈会显示在这里。</span></div>`;
      return `<div class="report-list">${state.notices.slice(0, 6).map(notice =>
        `<div class="report-row"><div class="report-icon">🔔</div><div><strong>${escapeHTML(notice.text)}</strong><small>${formatTime(notice.time)}</small></div><span>›</span></div>`
      ).join("")}</div>`;
    }

    function bindDynamicActions() {
      const identitySelect = document.getElementById("cleanerIdentitySelect");
      if (identitySelect) {
        identitySelect.addEventListener("change", () => {
          state.selectedCleanerId = identitySelect.value;
          state.currentFilter = "all";
          saveState();
          renderApp();
          showToast(`已切换为${getCurrentCleaner().name}的工作台`, "info");
        });
      }

      document.querySelectorAll("[data-floor]").forEach(btn => btn.addEventListener("click", () => {
        const cleaner = getCurrentCleaner();
        const floor = Number(btn.dataset.floor);
        if (!cleaner || !CONFIG.buildingFloors.includes(floor)) {
          showToast("楼层信息有误，请刷新后重试", "error");
          return;
        }
        const floors = normalizeFloors(cleaner.floors);
        const alreadySelected = floors.includes(floor);
        cleaner.floors = alreadySelected
          ? floors.filter(item => item !== floor)
          : normalizeFloors([...floors, floor]);
        cleaner.area = formatFloors(cleaner.floors, "未选择负责楼层");
        addNotice(`${cleaner.name}${alreadySelected ? "取消了" : "选择了"}${floor}楼清洁区域`);
        saveState();
        renderApp();
        showToast(alreadySelected ? `已取消${floor}楼` : `已选择${floor}楼，保存成功`, alreadySelected ? "info" : "success");
      }));

      document.querySelectorAll("[data-filter]").forEach(btn => btn.addEventListener("click", () => {
        state.currentFilter = btn.dataset.filter;
        saveState();
        renderApp();
        document.getElementById("taskSection")?.scrollIntoView({ behavior: "smooth", block: "start" });
      }));

      document.querySelectorAll("[data-scroll-target]").forEach(btn => btn.addEventListener("click", () => {
        document.getElementById(btn.dataset.scrollTarget)?.scrollIntoView({ behavior: "smooth", block: "start" });
      }));

      document.querySelectorAll("[data-action]").forEach(btn => btn.addEventListener("click", handleMainAction));
      document.querySelectorAll("[data-edit-phone]").forEach(btn => btn.addEventListener("click", () => {
        const cleaner = getCleanerById(btn.dataset.editPhone);
        if (cleaner) openPhoneModal(cleaner);
      }));
      document.querySelectorAll("[data-view-attendance]").forEach(btn => btn.addEventListener("click", () => {
        const cleaner = getCleanerById(btn.dataset.viewAttendance);
        if (cleaner) openAttendanceEvidenceModal(cleaner);
      }));
      document.querySelectorAll("[data-task-action]").forEach(btn => btn.addEventListener("click", () => {
        handleTaskAction(btn.dataset.taskAction, btn.dataset.id);
      }));
    }

    function handleMainAction(event) {
      const action = event.currentTarget.dataset.action;
      if (action === "checkin") openCheckinModal();
      if (action === "new-task") openNewTaskModal();
      if (action === "new-cleaner") openNewCleanerModal();
      if (action === "manual-score") openManualScoreModal();
      if (action === "open-help") openHelp();
      if (action === "reset") resetData();
    }

    function openCheckinModal() {
      const cleaner = getCurrentCleaner();
      if (getTodayAttendance(cleaner)) {
        showToast("今天已经打过卡啦", "info");
        return;
      }
      currentAttendanceEvidence = { data: "", type: "", name: "" };
      const now = new Date();
      const late = isLateCheckin(now);
      const statusText = late ? `当前已迟到 ${minutesAfterCheckinStart(now)} 分钟，提交后信用分 -1` : "当前属于准时打卡，不扣分";
      openModal(`
        <div class="modal-head"><div><h3>现场拍照或视频打卡</h3><p class="modal-sub">打卡凭证会向主管公开，用于确认到岗时间，避免代打卡。</p></div><button class="icon-btn" data-close-modal type="button" aria-label="关闭">✕</button></div>
        <div class="checkin-status-preview ${late ? "late" : "normal"}"><strong>${late ? "⏰ 迟到打卡" : "✅ 准时打卡"}</strong><span>${statusText}</span></div>
        <form id="checkinForm">
          <div class="field" id="attendanceEvidenceField">
            <label for="attendanceEvidence">打卡凭证 *</label>
            <label class="upload-box evidence-upload" id="attendanceEvidenceBox" for="attendanceEvidence">
              <input id="attendanceEvidence" type="file" accept="image/*,video/*" capture="environment">
              <span id="attendanceEvidencePrompt"><span class="upload-icon">📸</span><strong>点击拍照或录制短视频</strong><small>图片建议清楚拍到工作地点；视频需小于 3MB</small></span>
            </label>
            <p class="error-text">请先拍照或选择短视频</p>
          </div>
          <label class="confirm-check"><input id="checkinConfirm" type="checkbox"> <span>我确认这是本人今天在工作地点拍摄的真实凭证</span></label>
          <button class="btn btn-wide" type="submit">确认提交打卡</button>
        </form>
      `);
      setupAttendanceEvidenceInput();
      document.getElementById("checkinForm").addEventListener("submit", event => {
        event.preventDefault();
        const confirmed = document.getElementById("checkinConfirm").checked;
        document.getElementById("attendanceEvidenceField").classList.toggle("invalid", !currentAttendanceEvidence.data);
        if (!currentAttendanceEvidence.data) {
          showToast("请先拍照或录制短视频", "error");
          return;
        }
        if (!confirmed) {
          showToast("请先确认打卡凭证真实有效", "error");
          return;
        }
        doCheckin(currentAttendanceEvidence);
      });
    }

    function setupAttendanceEvidenceInput() {
      const input = document.getElementById("attendanceEvidence");
      input.addEventListener("change", async () => {
        const file = input.files && input.files[0];
        if (!file) return;
        const isImage = file.type.startsWith("image/");
        const isVideo = file.type.startsWith("video/");
        if (!isImage && !isVideo) {
          showToast("只能选择图片或视频", "error");
          input.value = "";
          return;
        }
        if (isVideo && file.size > 3 * 1024 * 1024) {
          showToast("视频超过 3MB，请录制更短的视频", "error");
          input.value = "";
          return;
        }
        if (isImage && file.size > 12 * 1024 * 1024) {
          showToast("图片超过 12MB，请换一张较小的图片", "error");
          input.value = "";
          return;
        }
        try {
          const data = isImage ? await compressImage(file) : await readFileAsDataURL(file);
          currentAttendanceEvidence = { data, type: isImage ? "image" : "video", name: file.name || (isImage ? "打卡照片" : "打卡视频") };
          const box = document.getElementById("attendanceEvidenceBox");
          box.querySelectorAll("img,video").forEach(media => media.remove());
          document.getElementById("attendanceEvidencePrompt").classList.add("hidden");
          const media = document.createElement(isImage ? "img" : "video");
          media.className = "upload-preview";
          media.src = data;
          media.alt = "打卡凭证预览";
          if (isVideo) media.controls = true;
          box.appendChild(media);
          box.closest(".field")?.classList.remove("invalid");
          showToast(isImage ? "打卡照片已选择" : "打卡视频已选择", "success");
        } catch (error) {
          showToast("凭证读取失败，请重新选择", "error");
        }
      });
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => resolve(String(reader.result || ""));
        reader.readAsDataURL(file);
      });
    }

    function doCheckin(evidence) {
      const cleaner = getCurrentCleaner();
      if (getTodayAttendance(cleaner)) {
        showToast("今天已经打过卡啦", "info");
        return;
      }
      const now = new Date();
      const late = isLateCheckin(now);
      const lateMinutes = late ? minutesAfterCheckinStart(now) : 0;
      cleaner.attendance.unshift({
        date: todayKey(),
        time: `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`,
        status: late ? "late" : "normal",
        lateMinutes,
        evidenceData: evidence.data,
        evidenceType: evidence.type,
        evidenceName: evidence.name
      });
      if (late) {
        recordScoreChange(cleaner, -1, `迟到 ${lateMinutes} 分钟`, "考勤打卡", "系统自动");
      } else {
        recordScoreChange(cleaner, 0, "准时打卡，凭证有效", "考勤打卡", "系统自动");
      }
      addNotice(`${cleaner.name}${late ? `迟到 ${lateMinutes} 分钟，信用分 -1` : "准时打卡成功"}，凭证已保存`);
      saveState();
      closeModal();
      renderApp();
      showToast(late ? `打卡成功：迟到 ${lateMinutes} 分钟，已按规则扣 1 分` : "打卡成功，现场凭证已保存", late ? "info" : "success");
    }

    function openAttendanceEvidenceModal(cleaner) {
      const attendance = getTodayAttendance(cleaner);
      if (!attendance) {
        showToast(`${cleaner.name}今天还没有打卡`, "info");
        return;
      }
      const media = attendance.evidenceData
        ? attendance.evidenceType === "video"
          ? `<video class="attendance-media" src="${attendance.evidenceData}" controls playsinline></video>`
          : `<img class="attendance-media" src="${attendance.evidenceData}" alt="${escapeHTML(cleaner.name)}的打卡照片">`
        : `<div class="empty"><span class="empty-icon">📭</span><strong>旧版打卡没有保存凭证</strong><span>从优化版开始，打卡必须上传照片或视频。</span></div>`;
      openModal(`
        <div class="modal-head"><div><h3>${escapeHTML(cleaner.name)}的今日打卡</h3><p class="modal-sub">工号 ${escapeHTML(cleaner.employeeNo)} · ${attendance.time} · ${attendanceStatusText(attendance)}</p></div><button class="icon-btn" data-close-modal type="button" aria-label="关闭">✕</button></div>
        <div class="evidence-meta"><span>📅 ${todayKey()}</span><span>📎 ${escapeHTML(attendance.evidenceName || "无文件名")}</span></div>
        ${media}
        <button class="btn btn-wide btn-soft" data-close-modal type="button" style="margin-top:14px">关闭</button>
      `);
    }

    function openManualScoreModal() {
      if (!state.cleaners.length) {
        showToast("请先录入保洁员", "error");
        return;
      }
      openModal(`
        <div class="modal-head"><div><h3>记录公开奖惩</h3><p class="modal-sub">必须选择人员、加减分类型并填写具体事实。提交后会同时显示给主管和保洁员。</p></div><button class="icon-btn" data-close-modal type="button" aria-label="关闭">✕</button></div>
        <form id="manualScoreForm">
          <div class="form-grid">
            <div class="field"><label for="manualCleanerId">保洁员 *</label><select id="manualCleanerId" name="cleanerId">${cleanerOptions(state.selectedCleanerId)}</select></div>
            <div class="field"><label for="manualDelta">奖惩类型 *</label><select id="manualDelta" name="delta"><option value="1">奖励 +1 分</option><option value="-1">扣除 -1 分</option></select></div>
            <div class="field full" id="manualReasonField"><label for="manualReason">事实与原因 *</label><textarea id="manualReason" maxlength="120" placeholder="例如：主动完成临时清洁任务，并经现场检查合格。"></textarea><p class="error-text">请填写具体事实和原因</p></div>
          </div>
          <button class="btn btn-wide" type="submit">确认并公开记录</button>
        </form>
      `);
      document.getElementById("manualScoreForm").addEventListener("submit", event => {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        const cleaner = getCleanerById(String(form.get("cleanerId") || ""));
        const delta = Number(form.get("delta"));
        const reason = document.getElementById("manualReason").value.trim();
        document.getElementById("manualReasonField").classList.toggle("invalid", !reason);
        if (!cleaner || !reason || ![1, -1].includes(delta)) {
          showToast("请补全奖惩信息", "error");
          return;
        }
        const result = recordScoreChange(cleaner, delta, reason, "主管手动奖惩", CONFIG.managerName);
        addNotice(`${cleaner.name}${result.applied > 0 ? `奖励 +${result.applied}` : result.applied < 0 ? `扣除 ${result.applied}` : "分数未变化"}：${reason}`);
        saveState();
        closeModal();
        renderApp();
        showToast("奖惩记录已公开保存", "success");
      });
    }

    function handleTaskAction(action, id) {
      const task = state.tasks.find(item => item.id === id);
      if (!task) {
        showToast("找不到这条任务，请刷新后重试", "error");
        return;
      }

      if (action === "accept") {
        task.status = "cleaning";
        task.updatedAt = Date.now();
        addNotice(`${task.location} 已接单，开始打扫`);
        saveState();
        renderApp();
        showToast("接单成功！请完成清洁后上传整改图", "success");
      }

      if (action === "complete") openCompleteModal(task);

      if (action === "assign") {
        openAssignModal(task);
      }

      if (action === "approve") approveTask(task);
      if (action === "rework") openReworkModal(task);
    }

    function approveTask(task) {
      const cleaner = getAssignedCleaner(task);
      if (!cleaner) {
        showToast("该任务没有有效的保洁员，无法更新信用分", "error");
        return;
      }
      const ok = window.confirm(`确认“${task.location}”已经打扫干净并通过验收吗？`);
      if (!ok) return;
      task.status = "completed";
      task.updatedAt = Date.now();
      task.remark = "验收合格";
      recordScoreChange(cleaner, 1, `${task.location}验收通过`, "任务验收", CONFIG.managerName);
      cleaner.completed += 1;
      addNotice(`${task.location} 已验收，${cleaner.name}信用分 +1`);
      saveState();
      renderApp();
      celebrate();
      showToast(`验收通过！${cleaner.name}信用分 +1`, "success");
    }

    function addNotice(text) {
      state.notices.unshift({ id: "notice_" + Date.now(), text, time: Date.now() });
      state.notices = state.notices.slice(0, 20);
    }

    function openHelp() {
      openModal(`
        <div class="modal-head"><div><h3>这样使用最简单</h3><p class="modal-sub">每个卫生问题都会留下清楚的处理记录。</p></div><button class="icon-btn" data-close-modal type="button" aria-label="关闭">✕</button></div>
        <div class="report-list">
          <div class="report-row"><div class="report-icon">1️⃣</div><div><strong>主管录入人员并发布任务</strong><small>建立保洁身份，选择具体人员分配</small></div></div>
          <div class="report-row"><div class="report-icon">2️⃣</div><div><strong>保洁员处理</strong><small>接单、打扫并上传整改照片</small></div></div>
          <div class="report-row"><div class="report-icon">3️⃣</div><div><strong>拍照或视频打卡</strong><small>9:00 后显示迟到分钟数并按公开规则扣 1 分</small></div></div>
          <div class="report-row"><div class="report-icon">4️⃣</div><div><strong>主管验收与公开奖惩</strong><small>验收通过 +1；返工 -1；所有变化必须写明原因</small></div></div>
          <div class="report-row"><div class="report-icon">🏢</div><div><strong>保洁员选择负责楼层</strong><small>整栋楼共5层，每人可以选择一个或多个楼层</small></div></div>
          <div class="report-row"><div class="report-icon">☎️</div><div><strong>员工本人填写手机号</strong><small>主管只能查看脱敏号码并一键拨打，不能代填或修改</small></div></div>
        </div>
        <button class="btn btn-wide" data-close-modal type="button" style="margin-top:16px">我明白了</button>
      `);
    }

    function cleanerOptions(selectedId = "", includePending = false) {
      const pending = includePending ? `<option value="">暂不分配</option>` : "";
      return pending + state.cleaners.map(cleaner =>
        `<option value="${cleaner.id}" ${cleaner.id === selectedId ? "selected" : ""}>${escapeHTML(cleaner.name)}｜${escapeHTML(cleaner.employeeNo)}｜${escapeHTML(formatFloors(cleaner.floors, cleaner.area))}</option>`
      ).join("");
    }

      openModal(`
        <div class="modal-head"><div><h3>录入保洁员身份</h3><p class="modal-sub">录入后，这位保洁员会出现在任务分配名单和身份选择中。</p></div><button class="icon-btn" data-close-modal type="button" aria-label="关闭">✕</button></div>

          <div class="form-grid">
            <div class="field" id="cleanerNameField">
              <label for="cleanerName">姓名 *</label>
              <input id="cleanerName" name="name" maxlength="20" placeholder="例如：张小洁">
              <p class="error-text">请填写保洁员姓名</p>
            </div>
            <div class="field" id="employeeNoField">
              <label for="employeeNo">保洁工号 *</label>
