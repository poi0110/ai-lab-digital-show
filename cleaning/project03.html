              <input id="cleanerArea" name="area" maxlength="40" placeholder="楼层由保洁员进入工作台后自行选择">
              <p class="field-hint">整栋楼共5层，保洁员之后可以自行选择负责的一层或多层。</p>
            </div>
            <div class="field full">
              <p class="mini-note" style="margin:0">手机号不由主管填写。人员录入后，请保洁员进入自己的工作台自行填写。新人员初始信用分为 8 分，基础工资为 ${CONFIG.baseSalary} 元。</p>
            </div>
          </div>
          <button class="btn btn-wide" type="submit">确认录入人员</button>
        </form>
      `);

      document.getElementById("newCleanerForm").addEventListener("submit", event => {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        const name = String(form.get("name") || "").trim();
        const employeeNo = String(form.get("employeeNo") || "").trim().toUpperCase();
        const area = String(form.get("area") || "").trim();
        const duplicateNo = state.cleaners.some(cleaner => cleaner.employeeNo.toUpperCase() === employeeNo);
        document.getElementById("cleanerNameField").classList.toggle("invalid", !name);
        document.getElementById("employeeNoField").classList.toggle("invalid", !employeeNo || duplicateNo);
        if (!name || !employeeNo || duplicateNo) {
          const message = duplicateNo ? "这个工号已经存在，请换一个"
            : "请补全保洁员身份信息";
          showToast(message, "error");
          return;
        }

        const cleaner = {
          id: "cleaner_" + Date.now(),
          name,
          employeeNo,
          area: area || "未选择负责楼层",
          floors: [],
          phone: "",
          credit: 8,
          completed: 0,
          attendance: []
        };
        state.cleaners.push(cleaner);
        state.selectedCleanerId = cleaner.id;
        addNotice(`已录入保洁员${name}（${employeeNo}）`);
        saveState();
        closeModal();
        renderApp();
        showToast(`${name}已加入任务分配名单`, "success");
      });
    }

    function openPhoneModal(cleaner) {
      if (state.role !== "cleaner" || cleaner.id !== getCurrentCleaner()?.id) {
        showToast("手机号只能由保洁员本人填写或修改", "error");
        return;
      }
      openModal(`
        <div class="modal-head"><div><h3>${isValidPhone(cleaner.phone) ? "修改我的" : "填写我的"}手机号</h3><p class="modal-sub">${escapeHTML(cleaner.name)}｜工号 ${escapeHTML(cleaner.employeeNo)}。请填写你本人使用的手机号。</p></div><button class="icon-btn" data-close-modal type="button" aria-label="关闭">✕</button></div>
        <form id="phoneForm" novalidate>
          <div class="field" id="phoneEditField">
            <label for="phoneEditInput">11位手机号 *</label>
            <input id="phoneEditInput" name="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="11" value="${isValidPhone(cleaner.phone) ? normalizePhone(cleaner.phone) : ""}" placeholder="请输入11位手机号">
            <p class="error-text">请输入正确且没有重复的11位手机号</p>
            <p class="field-hint">保存后，页面只显示脱敏号码，例如：138****0000。</p>
          </div>
          <button class="btn btn-wide" type="submit">保存手机号</button>
        </form>
      `);

      document.getElementById("phoneForm").addEventListener("submit", event => {
        event.preventDefault();
        const phone = normalizePhone(new FormData(event.currentTarget).get("phone"));
        const duplicate = isValidPhone(phone) && state.cleaners.some(item =>
          item.id !== cleaner.id && normalizePhone(item.phone) === phone
        );
        const invalid = !isValidPhone(phone) || duplicate;
        document.getElementById("phoneEditField").classList.toggle("invalid", invalid);
        if (invalid) {
          showToast(duplicate ? "这个手机号已经属于其他保洁员" : "请输入正确的11位手机号", "error");
          return;
        }
        cleaner.phone = phone;
        addNotice(`${cleaner.name}本人已更新手机号`);
        saveState();
        closeModal();
        renderApp();
        showToast("手机号保存成功，可以一键拨打了", "success");
      });
    }

    function openAssignModal(task) {
      if (!state.cleaners.length) {
        showToast("请先录入至少一位保洁员", "error");
        openNewCleanerModal();
        return;
      }
      openModal(`
        <div class="modal-head"><div><h3>选择保洁员</h3><p class="modal-sub">为“${escapeHTML(task.location)}”选择具体负责人。</p></div><button class="icon-btn" data-close-modal type="button" aria-label="关闭">✕</button></div>
        <form id="assignTaskForm">
          <div class="field">
            <label for="assignCleanerId">任务负责人</label>
            <select id="assignCleanerId" name="cleanerId">${cleanerOptions(state.selectedCleanerId)}</select>
          </div>
          <button class="btn btn-wide" type="submit">确认分配并通知保洁员</button>
        </form>
      `);
      document.getElementById("assignTaskForm").addEventListener("submit", event => {
        event.preventDefault();
        const cleaner = getCleanerById(new FormData(event.currentTarget).get("cleanerId"));
        if (!cleaner) {
          showToast("请选择有效的保洁员", "error");
          return;
        }
        task.status = "assigned";
        task.assignedCleanerId = cleaner.id;
        task.assignedTo = cleaner.name;
        task.updatedAt = Date.now();
        addNotice(`${task.location} 已派给${cleaner.name}`);
        saveState();
        closeModal();
        renderApp();
        showToast(`任务已派给${cleaner.name}`, "success");
      });
    }

    function openNewTaskModal() {
      currentModalPhoto = "";
      openModal(`
        <div class="modal-head"><div><h3>发布卫生任务</h3><p class="modal-sub">地点和问题描述要写清楚，保洁员才能快速处理。</p></div><button class="icon-btn" data-close-modal type="button" aria-label="关闭">✕</button></div>
        <form id="newTaskForm" novalidate>
          <div class="form-grid">
            <div class="field" id="locationField">
              <label for="taskLocation">问题地点 *</label>
              <input id="taskLocation" name="location" maxlength="30" placeholder="例如：三楼走廊">
              <p class="error-text">请填写具体地点</p>
            </div>
            <div class="field">
              <label for="taskCategory">问题类型</label>
              <select id="taskCategory" name="category">
                <option>公共区域</option><option>卫生间</option><option>教室</option><option>垃圾处理</option><option>其他</option>
              </select>
            </div>
            <div class="field full" id="descriptionField">
              <label for="taskDescription">卫生问题 *</label>
              <textarea id="taskDescription" name="description" maxlength="120" placeholder="例如：地面有饮料污渍，需要拖洗并放置防滑提示。"></textarea>
              <p class="error-text">请说明需要处理的卫生问题</p>
            </div>
            <div class="field">
              <label for="taskUrgent">紧急程度</label>
              <select id="taskUrgent" name="urgent"><option value="false">普通</option><option value="true">紧急</option></select>
            </div>
            <div class="field">
              <label for="taskAssign">任务分配</label>
              <select id="taskAssign" name="assign">${cleanerOptions(state.selectedCleanerId, true)}</select>
            </div>
            <div class="field full">
              <label>现场照片（选填）</label>
              ${uploadControl("beforePhoto", "📷", "点击拍照或选择现场图片")}
              <p class="field-hint">图片只保存在当前设备中，不会上传到网络。</p>
            </div>
          </div>
          <button class="btn btn-wide" type="submit">发布任务并通知保洁员</button>
        </form>
      `);
      setupImageInput("beforePhoto");
      document.getElementById("newTaskForm").addEventListener("submit", submitNewTask);
    }

    function submitNewTask(event) {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      const location = String(form.get("location") || "").trim();
      const description = String(form.get("description") || "").trim();
      document.getElementById("locationField").classList.toggle("invalid", !location);
      document.getElementById("descriptionField").classList.toggle("invalid", !description);
      if (!location || !description) {
        showToast("请先补全标有 * 的内容", "error");
        return;
      }

      const assignedCleaner = getCleanerById(form.get("assign"));
      state.tasks.unshift({
        id: "task_" + Date.now(),
        location,
        category: form.get("category"),
        description,
        urgent: form.get("urgent") === "true",
        status: assignedCleaner ? "assigned" : "pending",
        assignedTo: assignedCleaner ? assignedCleaner.name : "",
        assignedCleanerId: assignedCleaner ? assignedCleaner.id : "",
        createdAt: Date.now(),
        updatedAt: Date.now(),
        beforeImage: currentModalPhoto,
        afterImage: "",
        remark: ""
      });
      addNotice(`${location} 新任务已发布${assignedCleaner ? `并派给${assignedCleaner.name}` : "，等待分配"}`);
      saveState();
      closeModal();
      renderApp();
      showToast("卫生任务发布成功！", "success");
    }

    function openCompleteModal(task) {
      currentModalPhoto = "";
      openModal(`
        <div class="modal-head"><div><h3>提交整改结果</h3><p class="modal-sub">${escapeHTML(task.location)}｜请上传打扫完成后的照片，方便主管验收。</p></div><button class="icon-btn" data-close-modal type="button" aria-label="关闭">✕</button></div>
        <form id="completeForm" novalidate>
          <div class="field" id="afterPhotoField">
            <label>整改完成照片 *</label>
            ${uploadControl("afterPhoto", "✨", "点击拍照或选择整改后的图片")}
            <p class="error-text">请先上传整改照片</p>
          </div>
          <div class="field">
            <label for="cleanerNote">完成说明（选填）</label>
            <textarea id="cleanerNote" maxlength="100" placeholder="例如：已拖洗地面、清理垃圾并放置防滑牌。"></textarea>
          </div>
          <button class="btn btn-wide" type="submit">提交给主管验收</button>
        </form>
      `);
      setupImageInput("afterPhoto");
      document.getElementById("completeForm").addEventListener("submit", event => {
        event.preventDefault();
        if (!currentModalPhoto) {
          document.getElementById("afterPhotoField").classList.add("invalid");
          showToast("请上传整改完成照片", "error");
          return;
        }
        task.afterImage = currentModalPhoto;
        task.status = "review";
        task.updatedAt = Date.now();
        task.remark = document.getElementById("cleanerNote").value.trim();
        addNotice(`${task.location} 已提交整改图，等待验收`);
        saveState();
        closeModal();
        renderApp();
        showToast("提交成功，主管会尽快验收", "success");
      });
    }

    function openReworkModal(task) {
      openModal(`
        <div class="modal-head"><div><h3>要求返工</h3><p class="modal-sub">请写清楚哪里还需要改进，保洁员会收到留言。</p></div><button class="icon-btn" data-close-modal type="button" aria-label="关闭">✕</button></div>
        <form id="reworkForm">
          <div class="field" id="reworkField">
            <label for="reworkReason">返工原因 *</label>
            <textarea id="reworkReason" maxlength="100" placeholder="例如：角落仍有纸屑，请再次清扫。"></textarea>
            <p class="error-text">请说明需要返工的原因</p>
          </div>
          <button class="btn btn-wide btn-danger-soft" type="submit">确认并通知保洁员</button>
        </form>
      `);
      document.getElementById("reworkForm").addEventListener("submit", event => {
        event.preventDefault();
        const reason = document.getElementById("reworkReason").value.trim();
        const cleaner = getAssignedCleaner(task);
        document.getElementById("reworkField").classList.toggle("invalid", !reason);
        if (!reason) {
          showToast("请先填写返工原因", "error");
          return;
        }
        if (!cleaner) {
          showToast("找不到该任务的保洁员，无法扣除信用分", "error");
          return;
        }
        task.status = "rework";
        task.remark = reason;
        task.updatedAt = Date.now();
        const scoreResult = recordScoreChange(cleaner, -1, `${task.location}返工：${reason}`, "任务返工", CONFIG.managerName);
        const deducted = scoreResult.applied < 0;
        addNotice(`${task.location} 需要返工，${cleaner.name}信用分${deducted ? " -1" : "已为 0 分"}：${reason}`);
        saveState();
        closeModal();
        renderApp();
        showToast(deducted ? "已通知返工，保洁员信用分 -1" : "已通知返工，信用分最低保持 0 分", "info");
      });
    }

    function uploadControl(id, icon, text) {
      return `<label class="upload-box" id="${id}Box" for="${id}">
        <input id="${id}" type="file" accept="image/*" capture="environment">
        <span id="${id}Prompt"><span class="upload-icon">${icon}</span><strong>${text}</strong></span>
      </label>`;
    }

    function setupImageInput(id) {
      const input = document.getElementById(id);
      input.addEventListener("change", async () => {
        const file = input.files && input.files[0];
        if (!file) return;
        if (!file.type.startsWith("image/")) {
          showToast("请选择图片文件", "error");
          input.value = "";
          return;
        }
        if (file.size > 12 * 1024 * 1024) {
          showToast("图片超过 12MB，请换一张较小的图片", "error");
          input.value = "";
          return;
        }
        try {
          currentModalPhoto = await compressImage(file);
          const box = document.getElementById(id + "Box");
          box.querySelectorAll("img").forEach(img => img.remove());
          const prompt = document.getElementById(id + "Prompt");
          prompt.classList.add("hidden");
          const img = document.createElement("img");
          img.className = "upload-preview";
          img.src = currentModalPhoto;
          img.alt = "已选择的照片预览";
          box.appendChild(img);
          box.closest(".field")?.classList.remove("invalid");
          showToast("照片已选择，可以提交了", "success");
        } catch (error) {
          showToast("图片读取失败，请重新选择", "error");
        }
      });
    }

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            const max = 900;
            const scale = Math.min(1, max / Math.max(img.width, img.height));
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));
            const context = canvas.getContext("2d");
            context.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", .68));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function openModal(content, closeable = true) {
      document.body.style.overflow = "hidden";
      const root = document.getElementById("modalRoot");
      root.innerHTML = `<div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true">${content}</section></div>`;
      root.querySelectorAll("[data-close-modal]").forEach(btn => btn.addEventListener("click", closeModal));
      if (closeable) {
        document.getElementById("modalBackdrop").addEventListener("click", event => {
          if (event.target.id === "modalBackdrop") closeModal();
        });
      }
    }

    function closeModal() {
      document.body.style.overflow = "";
      document.getElementById("modalRoot").innerHTML = "";
      currentModalPhoto = "";
      currentAttendanceEvidence = { data: "", type: "", name: "" };
    }

    function showToast(message, type = "success") {
      const zone = document.getElementById("toastZone");
      const toast = document.createElement("div");
      const icons = { success: "✅", error: "⚠️", info: "💡" };
      toast.className = `toast ${type}`;
      toast.innerHTML = `<span>${icons[type] || "🔔"}</span><span>${escapeHTML(message)}</span>`;
      zone.appendChild(toast);
      window.setTimeout(() => {
        toast.classList.add("out");
        window.setTimeout(() => toast.remove(), 260);
      }, 2800);
    }

    function celebrate() {
      const colors = ["#48b985", "#ffd86b", "#ff9368", "#5b8def", "#c87ef2"];
      for (let i = 0; i < 22; i += 1) {
        const piece = document.createElement("i");
        piece.className = "confetti";
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.background = colors[i % colors.length];
        piece.style.setProperty("--drift", (Math.random() * 180 - 90) + "px");
        piece.style.animationDelay = Math.random() * .35 + "s";
        document.body.appendChild(piece);
        window.setTimeout(() => piece.remove(), 1800);
      }
    }

    function startClock() {
      if (clockTimer) clearInterval(clockTimer);
      const update = () => {
        const now = new Date();
        const clock = document.getElementById("liveClock");
        const date = document.getElementById("liveDate");
        const miniClock = document.getElementById("miniClock");
        if (clock) clock.textContent = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
        if (miniClock) miniClock.textContent = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
        if (date) {
          const week = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"][now.getDay()];
          date.textContent = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 · ${week}`;
        }
      };
      update();
      clockTimer = window.setInterval(update, 30000);
    }

    document.querySelectorAll("[data-choose-role]").forEach(btn => {
      btn.addEventListener("click", () => requestRole(btn.dataset.chooseRole));
    });
    document.getElementById("exitIdentityButton").addEventListener("click", openExitIdentityModal);
    document.querySelectorAll("[data-scroll]").forEach(btn => btn.addEventListener("click", () => {
      document.getElementById(btn.dataset.scroll)?.scrollIntoView({ behavior: "smooth", block: "start" });
      document.querySelectorAll(".nav-btn").forEach(item => item.classList.toggle("active", item === btn));
    }));

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && document.getElementById("modalRoot").innerHTML) closeModal();
    });

    renderApp();
  </script>

<script id="portfolio-back-bridge">
  document.querySelector('[data-portfolio-back]').addEventListener('click', function (event) {
    if (window.parent === window) return;
    event.preventDefault();
    window.parent.postMessage({ type: 'ai-lab-full-preview-nav', href: './cleaning-works.html' }, '*');
  });
</script>
