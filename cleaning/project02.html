<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#55c89f">
  <meta name="description" content="优洁通——让卫生问题被看见、被处理、被确认。">
  <title>优洁通｜卫生任务管理</title>

  <!-- ==================== 页面样式：颜色、布局、手机端适配 ==================== -->
  <style>
    :root {
      --green-700: #18745b;
      --green-600: #259875;
      --green-500: #55c89f;
      --green-300: #a9e8d0;
      --green-100: #e9faf3;
      --yellow-500: #ffc85c;
      --yellow-100: #fff7d9;
      --red-500: #ef6b6b;
      --red-100: #fff0ef;
      --blue-500: #5f9cf5;
      --blue-100: #eef5ff;
      --ink: #20332d;
      --muted: #698078;
      --line: #dcebe5;
      --paper: #ffffff;
      --bg: #f4fbf8;
      --shadow: 0 12px 34px rgba(42, 103, 81, 0.12);
      --radius-lg: 24px;
      --radius-md: 17px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-width: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 5% 3%, rgba(255, 220, 126, 0.33), transparent 24rem),
        radial-gradient(circle at 94% 2%, rgba(121, 222, 185, 0.30), transparent 27rem),
        var(--bg);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 3px solid rgba(95, 156, 245, 0.35);
      outline-offset: 2px;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .app-shell {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 18px clamp(14px, 3vw, 30px) 80px;
    }

    .topbar {
      position: sticky;
      z-index: 20;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 0 -4px 18px;
      padding: 12px 4px;
      background: rgba(244, 251, 248, 0.86);
      backdrop-filter: blur(16px);
    }

    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 11px;
    }

    .brand-mark {
      display: grid;
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 15px;
      color: #fff;
      background: linear-gradient(145deg, #67d9b2, #269874);
      box-shadow: 0 8px 20px rgba(37, 152, 117, 0.24);
      font-size: 25px;
    }

    .brand h1 {
      overflow: hidden;
      margin: 0;
      font-size: clamp(21px, 3vw, 27px);
      letter-spacing: -0.04em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .role-switch {
      display: flex;
      flex: 0 0 auto;
      gap: 5px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.84);
      box-shadow: 0 6px 18px rgba(56, 105, 88, 0.08);
    }

    .role-btn {
      min-height: 42px;
      padding: 0 16px;
      border-radius: 12px;
      color: var(--muted);
      background: transparent;
      font-weight: 800;
      transition: 0.2s ease;
    }

    .role-btn.active {
      color: #fff;
      background: var(--green-600);
      box-shadow: 0 5px 14px rgba(37, 152, 117, 0.25);
    }

    .hero {
      position: relative;
      overflow: hidden;
      margin-bottom: 18px;
      padding: clamp(22px, 4vw, 38px);
      border: 1px solid rgba(255, 255, 255, 0.76);
      border-radius: 30px;
      color: #fff;
      background: linear-gradient(130deg, #247f64 0%, #51c197 58%, #8edfc2 100%);
      box-shadow: var(--shadow);
    }

    .hero::before,
    .hero::after {
      position: absolute;
      content: "";
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.13);
    }

    .hero::before {
      width: 230px;
      height: 230px;
      top: -115px;
      right: -40px;
    }

    .hero::after {
      width: 120px;
      height: 120px;
      right: 170px;
      bottom: -72px;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 0 0 10px;
      padding: 7px 11px;
      border: 1px solid rgba(255, 255, 255, 0.32);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.13);
      font-size: 13px;
      font-weight: 800;
    }

    .hero h2 {
      max-width: 660px;
      margin: 0;
      font-size: clamp(25px, 5vw, 43px);
      line-height: 1.18;
      letter-spacing: -0.05em;
    }

    .hero-subtitle {
      max-width: 690px;
      margin: 12px 0 0;
      color: rgba(255, 255, 255, 0.88);
      line-height: 1.75;
    }

    .hero-badge {
      display: grid;
      min-width: 138px;
      padding: 16px 18px;
      border: 1px solid rgba(255, 255, 255, 0.38);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.17);
      text-align: center;
      backdrop-filter: blur(8px);
    }

    .hero-badge strong {
      font-size: 25px;
    }

    .hero-badge span {
      margin-top: 3px;
      color: rgba(255, 255, 255, 0.82);
      font-size: 12px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat-card {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 7px 22px rgba(58, 112, 92, 0.07);
    }

    .stat-icon {
      display: grid;
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 14px;
      font-size: 20px;
    }

    .stat-card:nth-child(1) .stat-icon {
      background: var(--yellow-100);
    }

    .stat-card:nth-child(2) .stat-icon {
      background: var(--green-100);
    }

    .stat-card:nth-child(3) .stat-icon {
      background: var(--blue-100);
    }

    .stat-text {
      min-width: 0;
    }

    .stat-text strong {
      display: block;
      font-size: 24px;
      line-height: 1;
    }

    .stat-text span {
      display: block;
      margin-top: 6px;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .goal-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
      padding: 14px 16px;
      border: 1px solid #f1dda8;
      border-radius: var(--radius-md);
      background: var(--yellow-100);
      line-height: 1.5;
    }

    .goal-banner.success {
      border-color: #b7e9d6;
      background: var(--green-100);
    }

    .goal-main {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 11px;
    }

    .goal-main > span {
      font-size: 23px;
    }

    .goal-main strong,
    .goal-main small {
      display: block;
    }

    .goal-main small {
      margin-top: 2px;
      color: var(--muted);
    }

    .clock {
      flex: 0 0 auto;
      padding: 7px 10px;
      border-radius: 10px;
      color: #785612;
      background: rgba(255, 255, 255, 0.65);
      font-size: 12px;
      font-weight: 800;
    }

    .workspace {
      display: grid;
      grid-template-columns: 380px minmax(0, 1fr);
      align-items: start;
      gap: 18px;
    }

    .panel {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow);
    }

    .compose-panel {
      position: sticky;
      top: 86px;
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 20px 20px 14px;
    }

    .panel-title {
      margin: 0;
      font-size: 20px;
    }

    .panel-kicker {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .step-badge {
      flex: 0 0 auto;
      padding: 7px 10px;
      border-radius: 999px;
      color: var(--green-700);
      background: var(--green-100);
      font-size: 12px;
      font-weight: 800;
    }

    .task-form {
      display: grid;
      gap: 16px;
      padding: 6px 20px 22px;
    }

    .field {
      display: grid;
      min-width: 0;
      gap: 8px;
    }

    .field-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 14px;
      font-weight: 800;
    }

    .field-label small {
      color: var(--muted);
      font-weight: 500;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      min-height: 48px;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      color: var(--ink);
      background: #fbfefd;
      transition: 0.2s ease;
    }

    .field input,
    .field select {
      padding: 0 13px;
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
      padding: 12px 13px;
      line-height: 1.6;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--green-500);
      background: #fff;
    }

    .two-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .level-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .level-option {
      min-height: 46px;
      padding: 7px 5px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      color: var(--muted);
      background: #fff;
      font-size: 13px;
      font-weight: 800;
    }

    .level-option.active[data-level="1"] {
      border-color: var(--red-500);
      color: #bc3d3d;
      background: var(--red-100);
    }

    .level-option.active[data-level="2"] {
      border-color: #eca92a;
      color: #8a6111;
      background: var(--yellow-100);
    }

    .level-option.active[data-level="3"] {
      border-color: var(--green-500);
      color: var(--green-700);
      background: var(--green-100);
    }

    .photo-picker {
      position: relative;
      display: grid;
      min-height: 126px;
      overflow: hidden;
      place-items: center;
      border: 2px dashed #b6dacc;
      border-radius: 16px;
      color: var(--green-700);
      background: var(--green-100);
      text-align: center;
      transition: 0.2s ease;
    }

    .photo-picker:hover {
      border-color: var(--green-500);
      transform: translateY(-1px);
    }

    .photo-picker input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .photo-placeholder {
      padding: 18px;
      pointer-events: none;
    }

    .photo-placeholder span {
      display: block;
      margin-bottom: 6px;
      font-size: 27px;
    }

    .photo-placeholder strong {
      display: block;
      font-size: 14px;
    }

    .photo-placeholder small {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    .photo-preview {
      width: 100%;
      height: 178px;
      object-fit: cover;
    }

    .photo-change {
      position: absolute;
      right: 9px;
      bottom: 9px;
      padding: 7px 10px;
      border-radius: 10px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.91);
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
    }

    .primary-btn,
    .secondary-btn,
    .danger-btn {
      min-height: 49px;
      padding: 0 17px;
      border-radius: 14px;
      font-weight: 900;
      transition: 0.2s ease;
    }

    .primary-btn {
      color: #fff;
      background: linear-gradient(135deg, var(--green-600), var(--green-500));
      box-shadow: 0 7px 17px rgba(37, 152, 117, 0.24);
    }

    .primary-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(37, 152, 117, 0.29);
    }

    .primary-btn:active,
    .secondary-btn:active,
    .danger-btn:active {
      transform: translateY(1px);
    }

    .primary-btn:disabled {
      cursor: not-allowed;
      opacity: 0.62;
      transform: none;
    }

    .secondary-btn {
      border: 1.5px solid var(--line);
      color: var(--green-700);
      background: #fff;
    }

    .danger-btn {
      color: #b54444;
      background: var(--red-100);
    }

    .board-panel {
      min-height: 540px;
      padding-bottom: 18px;
    }

    .board-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 20px;
      border-bottom: 1px solid var(--line);
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      min-width: 0;
      gap: 6px;
    }

    .tab-btn {
      min-height: 41px;
      padding: 0 13px;
      border-radius: 11px;
      color: var(--muted);
      background: #f4f9f7;
      font-size: 13px;
      font-weight: 800;
    }

    .tab-btn.active {
      color: var(--green-700);
      background: var(--green-100);
      box-shadow: inset 0 0 0 1.5px var(--green-300);
    }

    .small-action {
      min-height: 40px;
      flex: 0 0 auto;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: var(--muted);
      background: #fff;
      font-size: 12px;
      font-weight: 800;
    }

    .task-list {
      display: grid;
      gap: 13px;
      padding: 17px;
    }

    .task-card {
      position: relative;
      display: grid;
      grid-template-columns: 142px minmax(0, 1fr);
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: #fff;
      box-shadow: 0 6px 18px rgba(47, 92, 77, 0.07);
      animation: cardIn 0.34s ease both;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .task-photo {
      position: relative;
      min-height: 176px;
      overflow: hidden;
      background: #dff4ec;
    }

    .task-photo img {
      width: 100%;
      height: 100%;
      min-height: 176px;
      object-fit: cover;
      cursor: zoom-in;
    }

    .photo-label {
      position: absolute;
      left: 9px;
      bottom: 9px;
      padding: 5px 8px;
      border-radius: 8px;
      color: #fff;
      background: rgba(21, 55, 45, 0.72);
      font-size: 10px;
      font-weight: 800;
    }

    .task-content {
      display: flex;
      min-width: 0;
      flex-direction: column;
      padding: 15px;
    }

    .task-topline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .task-topline h3 {
      min-width: 0;
      margin: 0;
      overflow-wrap: anywhere;
      font-size: 17px;
      line-height: 1.42;
    }

    .status-pill,
    .level-pill {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
    }

    .status-pill {
      padding: 6px 9px;
    }

    .status-pending {
      color: #8a6111;
      background: var(--yellow-100);
    }

    .status-completed {
      color: var(--green-700);
      background: var(--green-100);
    }

    .status-expired {
      color: #765f5f;
      background: #f1eeee;
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 9px;
    }

    .meta-chip {
      padding: 5px 8px;
      border-radius: 8px;
      color: var(--muted);
      background: #f4f8f6;
      font-size: 11px;
      font-weight: 700;
    }

    .level-pill {
      padding: 5px 8px;
    }

    .level-1 {
      color: #ba4040;
      background: var(--red-100);
    }

    .level-2 {
      color: #8a6111;
      background: var(--yellow-100);
    }

    .level-3 {
      color: var(--green-700);
      background: var(--green-100);
    }

    .task-desc,
    .feedback-box {
      margin: 10px 0 0;
      overflow-wrap: anywhere;
      color: #51665f;
      font-size: 13px;
      line-height: 1.65;
    }

    .feedback-box {
      padding: 10px 11px;
      border-radius: 11px;
      color: var(--green-700);
      background: var(--green-100);
    }

    .after-photo-strip {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 10px;
      padding: 8px;
      border: 1px solid #cdeade;
      border-radius: 12px;
      background: #f5fcf9;
    }

    .after-photo-strip img {
      width: 52px;
      height: 52px;
      flex: 0 0 auto;
      border-radius: 9px;
      object-fit: cover;
      cursor: zoom-in;
    }

    .after-photo-strip strong,
    .after-photo-strip small {
      display: block;
    }

    .after-photo-strip small {
      margin-top: 3px;
      color: var(--muted);
    }

    .task-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: auto;
      padding-top: 13px;
    }

    .task-actions button {
      min-height: 42px;
      padding: 0 13px;
      border-radius: 11px;
      font-size: 12px;
      font-weight: 900;
    }

    .complete-btn {
      color: #fff;
      background: var(--green-600);
    }

    .empty-state {
      display: grid;
      min-height: 390px;
      place-items: center;
      padding: 34px 20px;
      text-align: center;
    }

    .empty-inner {
      max-width: 330px;
    }

    .empty-illustration {
      display: grid;
      width: 94px;
      height: 94px;
      margin: 0 auto 17px;
      place-items: center;
      border-radius: 31px;
      background: linear-gradient(145deg, var(--green-100), var(--yellow-100));
      font-size: 44px;
      transform: rotate(-4deg);
    }

    .empty-state h3 {
      margin: 0;
      font-size: 19px;
    }

    .empty-state p {
      margin: 8px 0 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .cleaner-tip {
      display: flex;
      gap: 12px;
      margin: 16px 18px 0;
      padding: 14px;
      border-radius: 15px;
      color: #315a4d;
      background: linear-gradient(120deg, #edf9f5, #fff9e9);
      font-size: 13px;
      line-height: 1.6;
    }

    .cleaner-tip > span {
      flex: 0 0 auto;
      font-size: 23px;
    }

    .footer-tools {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 22px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .footer-tools button {
      padding: 6px 9px;
      border-radius: 8px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.75);
      font-size: 12px;
      font-weight: 700;
    }

    .modal-backdrop {
      position: fixed;
      z-index: 80;
      inset: 0;
      display: grid;
      overflow-y: auto;
      place-items: center;
      padding: 18px;
      background: rgba(19, 45, 37, 0.55);
      backdrop-filter: blur(7px);
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal {
      width: min(520px, 100%);
      max-height: calc(100vh - 36px);
      overflow-y: auto;
      border-radius: 25px;
      background: #fff;
      box-shadow: 0 24px 80px rgba(15, 45, 36, 0.27);
    }

    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 22px 22px 10px;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 22px;
    }

    .modal-head p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .close-btn {
      display: grid;
      width: 42px;
      height: 42px;

<script id="ai-lab-responsive-runtime">
(() => {
  const root = document.documentElement;
  const mobileUa = /Android|webOS|iPhone|iPad|iPod|Mobile|IEMobile|Opera Mini/i.test(navigator.userAgent || "");
  const coarsePointer = window.matchMedia?.("(hover: none) and (pointer: coarse)")?.matches || false;
  const updateLayoutMode = () => {
    const narrowScreen = window.innerWidth <= 768;
    const touchTablet = coarsePointer && window.innerWidth <= 1024;
    const mobileDevice = mobileUa && window.innerWidth <= 1180;
    const useH5 = narrowScreen || touchTablet || mobileDevice;
    root.classList.toggle("ai-lab-h5", useH5);
    root.classList.toggle("ai-lab-web", !useH5);
    root.dataset.layoutMode = useH5 ? "h5" : "web";
  };
  updateLayoutMode();
  window.addEventListener("resize", updateLayoutMode, { passive: true });
  window.addEventListener("orientationchange", updateLayoutMode, { passive: true });
})();
</script>

    const STORAGE_KEY = "youjietong_v1_tasks";

    /* ==================== 数据保存：localStorage读取、写入与图片压缩 ==================== */
    const storage = {
      loadTasks() {
        try {
          const value = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          return Array.isArray(value) ? value : [];
        } catch (error) {
          showToast("本地数据读取失败，已为你恢复空白页面。", "error");
          return [];
        }
      },
      saveTasks(tasks) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
          return true;
        } catch (error) {
          showToast("保存空间不足，请删除一些旧任务后重试。", "error");
          return false;
        }
      },
      loadPreferences() {
        try {
          return JSON.parse(localStorage.getItem(PREF_KEY) || "{}");
        } catch (error) {
          return {};
        }
      },
      savePreferences(preferences) {
        try {
          localStorage.setItem(PREF_KEY, JSON.stringify(preferences));
        } catch (error) {
          /* 偏好保存失败不会影响核心任务流程 */
        }
      }
    };

    function compressImage(file, maxSide = 900, quality = 0.72) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith("image/")) {
          reject(new Error("请选择图片文件"));
          return;
        }
        if (file.size > 15 * 1024 * 1024) {
          reject(new Error("图片不能超过15MB"));
          return;
        }

        const reader = new FileReader();
        reader.onerror = () => reject(new Error("图片读取失败"));
        reader.onload = () => {
          const image = new Image();
          image.onerror = () => reject(new Error("无法识别这张图片"));
          image.onload = () => {
            let width = image.width;
            let height = image.height;
            if (Math.max(width, height) > maxSide) {
              const ratio = maxSide / Math.max(width, height);
              width = Math.round(width * ratio);
              height = Math.round(height * ratio);
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const context = canvas.getContext("2d");
            context.fillStyle = "#ffffff";
            context.fillRect(0, 0, width, height);
            context.drawImage(image, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          image.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    /* ==================== 核心功能：状态、发布任务、完成反馈与页面交互 ==================== */

    function pad(number) {
      return String(number).padStart(2, "0");
    }

    function localDateKey(date = new Date()) {
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }

    function formatDateTime(iso) {
      const date = new Date(iso);
      if (Number.isNaN(date.getTime())) return "";
      return `${date.getMonth() + 1}月${date.getDate()}日 ${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    function formatToday() {
      const date = new Date();
      const week = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"][date.getDay()];
      return `${date.getMonth() + 1}月${date.getDate()}日 · ${week}`;
    }

    function escapeHTML(value = "") {
      const temp = document.createElement("div");
      temp.textContent = String(value);
      return temp.innerHTML;
    }

    function createId() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return `task_${Date.now()}_${Math.random().toString(16).slice(2)}`;
    }

    function todayTasks() {
      const today = localDateKey();
      return state.tasks.filter(task => task.date === today);
    }

    function taskStatus(task) {
      if (task.status === "completed") return "completed";
      return task.date === localDateKey() ? "pending" : "expired";
    }

    function filteredTasks() {
      const today = localDateKey();
      let result = [...state.tasks];
      if (state.filter === "today") {
        result = result.filter(task => task.date === today);
      } else if (state.filter === "pending") {
        result = result.filter(task => task.date === today && task.status === "pending");
      } else if (state.filter === "completed") {
        result = result.filter(task => task.date === today && task.status === "completed");
      } else if (state.filter === "history") {
        result = result.filter(task => task.date !== today);
      }

      return result.sort((a, b) => {
        const statusA = taskStatus(a) === "pending" ? 0 : 1;
        const statusB = taskStatus(b) === "pending" ? 0 : 1;
        if (statusA !== statusB) return statusA - statusB;
        if (a.status === "pending" && b.status === "pending" && Number(a.level) !== Number(b.level)) {
          return Number(a.level) - Number(b.level);
        }
        return new Date(b.createdAt) - new Date(a.createdAt);
      });
    }

    function showToast(message, type = "success") {
      if (!elements.toastStack) return;
      const toast = document.createElement("div");
      toast.className = `toast ${type}`;
      toast.innerHTML = `<span aria-hidden="true">${type === "error" ? "⚠️" : "✓"}</span><span>${escapeHTML(message)}</span>`;
      elements.toastStack.appendChild(toast);
      setTimeout(() => toast.remove(), 3100);
    }

    function launchConfetti() {
      const colors = ["#55c89f", "#ffc85c", "#5f9cf5", "#ff8b83", "#ffffff"];
      for (let index = 0; index < 32; index += 1) {
        const piece = document.createElement("span");
        piece.className = "confetti";
        piece.style.left = `${Math.random() * 100}vw`;
        piece.style.background = colors[index % colors.length];
        piece.style.setProperty("--drift", `${Math.round(Math.random() * 180 - 90)}px`);
        piece.style.animationDelay = `${Math.random() * 0.35}s`;
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 2300);
      }

    function renderStats() {
      const tasks = todayTasks();
      const pending = tasks.filter(task => task.status === "pending").length;
      const completed = tasks.filter(task => task.status === "completed").length;
      const rate = tasks.length ? Math.round((completed / tasks.length) * 100) : 0;

      elements.pendingCount.textContent = pending;
      elements.completedCount.textContent = completed;
      elements.feedbackCount.textContent = completed;
      elements.heroRate.textContent = `${rate}%`;

      const now = new Date();
      const afterSeven = now.getHours() >= 19;
      const allDone = tasks.length > 0 && pending === 0;
      elements.goalBanner.classList.toggle("success", allDone);

      if (allDone) {
        elements.goalIcon.textContent = "🎉";
        elements.goalTitle.textContent = "今天的卫生任务已全部解决";
        elements.goalText.textContent = "每个任务都有清洁照片和文字反馈，处理结果清楚可查。";
      } else if (afterSeven && pending > 0) {
        elements.goalIcon.textContent = "⚠️";
        elements.goalTitle.textContent = `已到19:00，还有${pending}项待办`;
        elements.goalText.textContent = "请保洁优先处理，完成后及时上传反馈。";
      } else if (tasks.length === 0) {
        elements.goalIcon.textContent = "🌿";
        elements.goalTitle.textContent = "今天暂时没有卫生任务";
        elements.goalText.textContent = state.role === "manager"
          ? "发现问题时，拍照并填写位置就能立即发布。"
          : "管理层发布后，待办任务会出现在这里。";
      } else {
        elements.goalIcon.textContent = "🕖";
        elements.goalTitle.textContent = "今日目标：19:00前完成全部任务";
        elements.goalText.textContent = `还有${pending}项待办，完成后请上传清洁照片。`;
      }
    }

      return {
        "1": "一级·紧急",

        "3": "三级·轻微"
      }[String(level)] || "二级·普通";

    function statusLabel(status) {

        pending: "待办",

    }

    function renderTaskCard(task) {
      const visualStatus = taskStatus(task);

      const safeFeedback = escapeHTML(task.feedback || "");

        ? `

        actions = `<button class="complete-btn" type="button" data-complete="${task.id}">打扫完成，上传反馈</button>`;
      }

      return `
        <article class="task-card" data-task-id="${task.id}">

            ${completionBlock}

    function renderTasks() {
      const tasks = filteredTasks();

        button.classList.toggle("active", active);

    async function handleBeforeImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      try {
        elements.beforePlaceholder.innerHTML = "<span>⏳</span><strong>正在处理图片…</strong>";
        state.beforeImage = await compressImage(file);
        elements.beforePreview.src = state.beforeImage;
        elements.beforePreview.classList.remove("hidden");
        elements.beforePlaceholder.classList.add("hidden");
        elements.beforeChange.classList.remove("hidden");
        showToast("问题照片已准备好");
      } catch (error) {
        resetBeforePhoto();
        elements.beforePlaceholder.innerHTML = `
          <span aria-hidden="true">📷</span>
          <strong>点击拍照或选择图片</strong>
          <small>图片会自动压缩并保存在当前设备</small>
        `;
        showToast(error.message || "图片处理失败", "error");
      }
    }

    function publishTask(event) {
      event.preventDefault();
      const floor = document.getElementById("taskFloor").value;
      const location = document.getElementById("taskLocation").value.trim();
      const issue = document.getElementById("taskIssue").value.trim();

      if (!floor) {
        showToast("请先选择楼层。", "error");
        document.getElementById("taskFloor").focus();
        return;
      }
      if (!location) {
        showToast("请填写具体位置。", "error");
        document.getElementById("taskLocation").focus();
        return;
      }
      if (!issue) {
        showToast("请写清楚卫生问题。", "error");
        document.getElementById("taskIssue").focus();
        return;
      }
      if (!state.beforeImage) {
        showToast("请上传卫生问题照片。", "error");
        elements.beforePhoto.focus();
        return;
      }

      const task = {
        id: createId(),
        date: localDateKey(),
        level: elements.taskLevel.value,
        floor,
        location,
        issue,
        beforeImage: state.beforeImage,
        status: "pending",
        createdAt: new Date().toISOString(),
        completedAt: "",
        afterImage: "",
        feedback: ""
      };

      const nextTasks = [task, ...state.tasks];
      elements.publishBtn.disabled = true;
      elements.publishBtn.textContent = "正在发布…";
      setTimeout(() => {
        if (storage.saveTasks(nextTasks)) {
          state.tasks = nextTasks;
          state.filter = "pending";
          resetForm();
          render();
          showToast("任务发布成功，保洁端已收到待办！");

    function demoImage(label, accent, icon) {
      const canvas = document.createElement("canvas");
      canvas.width = 900;
      canvas.height = 600;
      const context = canvas.getContext("2d");
      const gradient = context.createLinearGradient(0, 0, 900, 600);
      gradient.addColorStop(0, "#eaf8f3");
      gradient.addColorStop(1, accent);
      context.fillStyle = gradient;
      context.fillRect(0, 0, 900, 600);
      context.fillStyle = "rgba(255,255,255,.76)";
      context.beginPath();
      context.roundRect(170, 95, 560, 410, 48);
      context.fill();
      context.textAlign = "center";
      context.fillStyle = "#27624f";
      context.font = "110px sans-serif";
      context.fillText(icon, 450, 300);
      context.font = "bold 42px sans-serif";
      context.fillText(label, 450, 395);
      return canvas.toDataURL("image/jpeg", 0.72);
    }

      elements.modalRoot.innerHTML = "";
      state.completingTaskId = null;
      state.afterImage = "";
    }

    function completeTask(event) {
      event.preventDefault();
      if (!state.afterImage) {
        showToast("请先上传打扫后的照片。", "error");
        document.getElementById("afterPhoto").focus();
        return;
      }

      const feedback = document.getElementById("feedbackText").value.trim();
      const taskIndex = state.tasks.findIndex(item => item.id === state.completingTaskId);
      if (taskIndex < 0) {
        showToast("任务不存在，可能已经被删除。", "error");
        closeModal();
        return;
      }

      const nextTasks = [...state.tasks];
      nextTasks[taskIndex] = {
        ...nextTasks[taskIndex],
        status: "completed",
        completedAt: new Date().toISOString(),
        afterImage: state.afterImage,
        feedback: feedback || "已按要求完成清洁。"
      };

      const button = document.getElementById("confirmCompleteBtn");
      button.disabled = true;
      button.textContent = "正在提交…";
      setTimeout(() => {
        if (storage.saveTasks(nextTasks)) {
          state.tasks = nextTasks;
          closeModal();
          render();
          launchConfetti();
          showToast("反馈成功！任务已从“待办”变为“已办”。");
        } else {
          button.disabled = false;
          button.textContent = "确认完成";
        }
      }, 450);
    }

    function openConfirmModal({ title, text, confirmText, onConfirm }) {
      elements.modalRoot.innerHTML = `
        <div class="modal-backdrop">
          <section class="modal" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
            <div class="modal-head">
              <div>
                <h2 id="confirmTitle">${escapeHTML(title)}</h2>
                <p>${escapeHTML(text)}</p>
              </div>
              <button class="close-btn" type="button" data-close-modal aria-label="关闭">×</button>
            </div>
            <div class="modal-body">
              <div class="modal-actions">
                <button class="secondary-btn" type="button" data-close-modal>取消</button>
                <button class="danger-btn" id="confirmDangerBtn" type="button">${escapeHTML(confirmText)}</button>
              </div>
            </div>
          </section>
        </div>
      `;
      document.getElementById("confirmDangerBtn").addEventListener("click", onConfirm);
      document.querySelector(".close-btn").focus();
    }

    function resetAllData() {
      openConfirmModal({
        title: "重新开始？",
        text: "这会清空当前浏览器里的全部任务、照片和反馈，无法恢复。",
        confirmText: "清空并重新开始",
        onConfirm: () => {
          localStorage.removeItem(STORAGE_KEY);
          state.tasks = [];
          state.filter = "today";
          closeModal();
          resetForm();
          render();
          showToast("数据已清空，可以重新开始。");
        }
      });
    }

    function openGuide() {
      elements.modalRoot.innerHTML = `
        <div class="modal-backdrop">
          <section class="modal guide-modal" role="dialog" aria-modal="true" aria-labelledby="guideTitle">
            <div class="guide-hero">
              <div class="big-icon" aria-hidden="true">✨</div>
              <h2 id="guideTitle">欢迎使用优洁通</h2>
              <p>三步让卫生问题真正得到解决</p>
            </div>
            <div class="guide-steps">
              <div class="guide-step">
                <b>1</b>
                <div><strong>管理层发布</strong><small>拍问题照片，填写楼层、位置和说明。</small></div>
              </div>
              <div class="guide-step">
                <b>2</b>
                <div><strong>保洁处理</strong><small>切换到保洁端，打开待办并前往打扫。</small></div>
              </div>
              <div class="guide-step">
                <b>3</b>
                <div><strong>上传反馈</strong><small>拍下干净照片，任务自动变为已办。</small></div>
              </div>
            </div>
            <div class="guide-actions">
              <button class="secondary-btn" type="button" data-guide-role="cleaner">我是保洁</button>
              <button class="primary-btn" type="button" data-guide-role="manager">我是管理层</button>
            </div>
          </section>
        </div>
      `;
      document.querySelector("[data-guide-role='manager']").focus();
    }

    function openLightbox(imageSource, altText) {
      elements.modalRoot.innerHTML = `
        <div class="lightbox" role="dialog" aria-modal="true" aria-label="查看大图">
          <button class="lightbox-close" type="button" data-close-modal aria-label="关闭大图">×</button>
          <img src="${imageSource}" alt="${escapeHTML(altText)}">
        </div>
      `;
      document.querySelector(".lightbox-close").focus();
    }

    elements.roleButtons.forEach(button => {
      button.addEventListener("click", () => setRole(button.dataset.role));
    });

    document.querySelectorAll(".level-option").forEach(button => {
      button.addEventListener("click", () => {
        elements.taskLevel.value = button.dataset.level;
        document.querySelectorAll(".level-option").forEach(item => {
          item.classList.toggle("active", item === button);
        });
      });
    });

    elements.beforePhoto.addEventListener("change", handleBeforeImage);
    elements.taskForm.addEventListener("submit", publishTask);
    elements.filterButtons.forEach(button => {
      button.addEventListener("click", () => {
        state.filter = button.dataset.filter;
        renderTasks();
      });
    });
    elements.guideBtn.addEventListener("click", openGuide);
    elements.addDemoBtn.addEventListener("click", addDemoTask);
    elements.resetBtn.addEventListener("click", resetAllData);

    elements.taskList.addEventListener("click", event => {
      const completeButton = event.target.closest("[data-complete]");
      const demoButton = event.target.closest("[data-empty-demo]");
      const image = event.target.closest("img[data-lightbox]");
      if (completeButton) openCompletionModal(completeButton.dataset.complete);
      if (demoButton) addDemoTask();
      if (image) openLightbox(image.src, image.alt);
    });

    elements.modalRoot.addEventListener("click", event => {
      if (event.target.closest("[data-close-modal]")) {
        closeModal();
        return;
      }
      const guideRole = event.target.closest("[data-guide-role]");
      if (guideRole) {
        const role = guideRole.dataset.guideRole;
        storage.savePreferences({ ...storage.loadPreferences(), guideSeen: true, role });
        closeModal();
        setRole(role);
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && elements.modalRoot.innerHTML) closeModal();
    });

    window.addEventListener("storage", event => {
      if (event.key === STORAGE_KEY) {
        state.tasks = storage.loadTasks();
        render();
        showToast("任务数据已在另一个页面更新。");
      }
    });

    updateClock();
    setInterval(updateClock, 30000);
    render();

    const preferences = storage.loadPreferences();
    if (!preferences.guideSeen) {
      setTimeout(openGuide, 350);
    }
  </script>

<script id="portfolio-back-bridge">
  document.querySelector('[data-portfolio-back]').addEventListener('click', function (event) {
    if (window.parent === window) return;
    event.preventDefault();
    window.parent.postMessage({ type: 'ai-lab-full-preview-nav', href: './cleaning-works.html' }, '*');
  });
</script>
</body>
</html>
