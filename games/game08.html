<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <!-- 适配手机和电脑 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>彩虹贪吃蛇</title>

  <style>
    /* =========================
       页面基础样式
       ========================= */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 18px;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family:
        "Microsoft YaHei",
        "PingFang SC",
        Arial,
        sans-serif;

      color: #334155;

      /* 明亮可爱的背景 */
      background:
        radial-gradient(circle at 12% 18%, #fff3a6 0 7%, transparent 8%),
        radial-gradient(circle at 87% 15%, #ffb8d1 0 7%, transparent 8%),
        radial-gradient(circle at 83% 83%, #b8f3ff 0 8%, transparent 9%),
        linear-gradient(135deg, #b8f2e6, #fff4b8, #ffd6e8);

      overflow-x: hidden;
      touch-action: manipulation;
    }

    /* 游戏主卡片 */
    .game-card {
      width: min(94vw, 520px);
      padding: 22px;

      border: 4px solid rgba(255, 255, 255, 0.85);
      border-radius: 28px;

      background: rgba(255, 255, 255, 0.9);

      box-shadow:
        0 18px 50px rgba(76, 89, 130, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);

      text-align: center;
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0;

      font-size: clamp(28px, 7vw, 42px);
      color: #ff5f8f;

      text-shadow: 2px 2px 0 #fff2a8;
    }

    .subtitle {
      margin: 7px 0 17px;

      font-size: 14px;
      color: #64748b;
    }

    /* 分数栏 */
    .score-board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;

      margin-bottom: 14px;
    }

    .score-box {
      padding: 10px;

      border: 2px solid #ffffff;
      border-radius: 16px;

      background: linear-gradient(135deg, #e0faff, #f5efff);

      box-shadow: 0 6px 14px rgba(88, 113, 160, 0.12);
    }

    .score-label {
      display: block;
      margin-bottom: 2px;

      font-size: 13px;
      color: #64748b;
    }

    .score-number {
      font-size: 25px;
      font-weight: bold;
      color: #7c5cff;
    }

    /* 游戏画布外框 */
    .canvas-wrap {
      position: relative;
      width: 100%;
      overflow: hidden;

      border: 5px solid #ffffff;
      border-radius: 22px;

      background: #eafff5;

      box-shadow:
        0 10px 24px rgba(51, 65, 85, 0.18),
        0 0 0 3px #91e5c2;
    }

    canvas {
      display: block;

      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;

      background: #eafff5;

      /* 防止手机滑动游戏时页面跟着滚动 */
      touch-action: none;
    }

    /* 游戏开始和结束提示层 */
    .message-layer {
      position: absolute;
      inset: 0;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      padding: 20px;

      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(3px);

      transition: opacity 0.2s ease;
    }

    .message-layer.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .message-emoji {
      font-size: 55px;
      animation: bounce 1.1s infinite alternate;
    }

    .message-title {
      margin-top: 4px;

      font-size: 29px;
      font-weight: bold;
      color: #ff5f8f;
    }

    .message-text {
      margin-top: 7px;

      line-height: 1.6;
      color: #475569;
    }

    @keyframes bounce {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(-8px);
      }
    }

    /* 游戏规则说明 */
    .tip {
      margin: 14px 0 10px;
      padding: 10px 12px;

      border-radius: 14px;

      background: #fff8d9;

      font-size: 13px;
      line-height: 1.65;
      color: #785f2f;
    }

    /* 手机方向按钮 */
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 66px);
      grid-template-rows: repeat(2, 58px);
      justify-content: center;

      gap: 8px;
      margin-top: 12px;

      user-select: none;
    }

    .control-button {
      border: none;
      border-radius: 18px;

      background: linear-gradient(145deg, #8be9c7, #64d7b0);

      color: #ffffff;
      font-size: 26px;
      font-weight: bold;

      cursor: pointer;
      touch-action: manipulation;

      box-shadow:
        0 6px 0 #43b991,
        0 9px 14px rgba(56, 170, 132, 0.2);

      transition:
        transform 0.08s ease,
        box-shadow 0.08s ease;
    }

    .control-button:active {
      transform: translateY(5px);

      box-shadow:
        0 1px 0 #43b991,
        0 4px 8px rgba(56, 170, 132, 0.2);
    }

    .up-button {
      grid-column: 2;
      grid-row: 1;
    }

    .left-button {
      grid-column: 1;
      grid-row: 2;
    }

    .down-button {
      grid-column: 2;
      grid-row: 2;
    }

    .right-button {
      grid-column: 3;
      grid-row: 2;
    }

    /* 重新开始按钮 */
    .restart-button {
      width: 100%;

      margin-top: 18px;
      padding: 13px 18px;

      border: none;
      border-radius: 17px;

      background: linear-gradient(135deg, #ff7aa8, #ff9f68);

      color: #ffffff;
      font-size: 17px;
      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 7px 0 #e95f7f,
        0 11px 18px rgba(233, 95, 127, 0.22);

      transition:
        transform 0.08s ease,
        box-shadow 0.08s ease;
    }

    .restart-button:active {
      transform: translateY(6px);

      box-shadow:
        0 1px 0 #e95f7f,
        0 5px 10px rgba(233, 95, 127, 0.22);
    }

    /* 小屏幕适配 */
    @media (max-width: 420px) {
      body {
        padding: 10px;
        align-items: flex-start;
      }

      .game-card {
        padding: 14px;
        border-radius: 22px;
      }

      .controls {
        grid-template-columns: repeat(3, 62px);
        grid-template-rows: repeat(2, 54px);
      }

      .tip {
        font-size: 12px;
      }
    }
  </style>

<script id="ai-lab-responsive-runtime">
(() => {
  const root = document.documentElement;
  const mobileUa = /Android|webOS|iPhone|iPad|iPod|Mobile|IEMobile|Opera Mini/i.test(navigator.userAgent || "");
  const coarsePointer = window.matchMedia?.("(hover: none) and (pointer: coarse)")?.matches || false;
  const updateLayoutMode = () => {
    const narrowScreen = window.innerWidth <= 768;
    const touchTablet = coarsePointer && window.innerWidth <= 1024;
    const mobileDevice = mobileUa && window.innerWidth <= 1180;
    const useH5 = narrowScreen || touchTablet || mobileDevice;
    root.classList.toggle("ai-lab-h5", useH5);
    root.classList.toggle("ai-lab-web", !useH5);
    root.dataset.layoutMode = useH5 ? "h5" : "web";
  };
  updateLayoutMode();
  window.addEventListener("resize", updateLayoutMode, { passive: true });
  window.addEventListener("orientationchange", updateLayoutMode, { passive: true });
})();
</script>

<body>
<a class="portfolio-back-link" href="../snake-games.html" data-portfolio-back>← 返回贪吃蛇合集</a>
  <main class="game-card">
    <h1>🌈 彩虹贪吃蛇</h1>

    <p class="subtitle">
      吃苹果和西瓜，避开危险的石头！
    </p>

    <!-- 分数显示区域 -->
    <section class="score-board">
      <div class="score-box">
        <span class="score-label">当前分数</span>
        <span class="score-number" id="score">0</span>
      </div>

      <div class="score-box">
        <span class="score-label">最高分</span>
        <span class="score-number" id="bestScore">0</span>
      </div>
    </section>

    <!-- 游戏画布 -->
    <div class="canvas-wrap">
      <canvas
        id="gameCanvas"
        width="400"
        height="400"
      ></canvas>

      <!-- 开始或结束提示 -->
      <div class="message-layer" id="messageLayer">
        <div class="message-emoji" id="messageEmoji">
          🐍
        </div>

        <div class="message-title" id="messageTitle">
          准备出发！
        </div>

        <div class="message-text" id="messageText">
          按方向键、WASD或下方按钮开始
        </div>
      </div>
    </div>

    <!-- 游戏规则 -->
    <div class="tip">
      🍎 苹果：加10分，长度增加1格<br />
      🍉 西瓜：加20分，长度增加2格<br />
      🪨 石头：碰到就会失败<br />
      💻 电脑：使用方向键或WASD<br />
      📱 手机：点击按钮或滑动游戏区域
    </div>

    <!-- 手机方向控制按钮 -->
    <section class="controls" aria-label="游戏方向控制">
      <button
        class="control-button up-button"
        data-direction="up"
        aria-label="向上移动"
      >
        ▲
      </button>

      <button
        class="control-button left-button"
        data-direction="left"
        aria-label="向左移动"
      >
        ◀
      </button>

      <button
        class="control-button down-button"
        data-direction="down"
        aria-label="向下移动"
      >
        ▼
      </button>

      <button
        class="control-button right-button"
        data-direction="right"
        aria-label="向右移动"
      >
        ▶
      </button>
    </section>

    <!-- 重新开始按钮 -->
    <button class="restart-button" id="restartButton">
      🔄 重新开始
    </button>
  </main>

  <script>
    /* =========================
       一、获取网页元素
       ========================= */

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreElement = document.getElementById("score");
    const bestScoreElement = document.getElementById("bestScore");

    const messageLayer = document.getElementById("messageLayer");
    const messageEmoji = document.getElementById("messageEmoji");
    const messageTitle = document.getElementById("messageTitle");
    const messageText = document.getElementById("messageText");

    const restartButton = document.getElementById("restartButton");
    const controlButtons = document.querySelectorAll(".control-button");

    /* =========================
       二、游戏基础设置
       ========================= */

    // 棋盘分成20行和20列
    const gridCount = 20;

    // 每个格子的大小
    const cellSize = canvas.width / gridCount;

    /*
      小蛇移动速度。
      数字越大，移动越慢。
    */
    const gameSpeed = 220;

    // 石头数量
    const stoneCount = 6;

    // 游戏定时器
    let gameTimer = null;

    // 游戏状态
    let gameStarted = false;
    let gameOver = false;

    // 当前分数
    let score = 0;

    // 从浏览器中读取最高分
    let bestScore =
      Number(localStorage.getItem("snakeBestScore")) || 0;

    bestScoreElement.textContent = bestScore;

    // 小蛇身体数组
    let snake = [];

    // 苹果位置
    let apple = null;

    // 西瓜位置
    let watermelon = null;

    // 石头数组
    let stones = [];

    /*
      记录蛇还需要增长多少格。

      吃苹果后增加1。
      吃西瓜后增加2。
    */
    let growthRemaining = 0;

    // 当前移动方向
    let direction = {
      x: 1,
      y: 0
    };

    // 玩家下一次准备移动的方向
    let nextDirection = {
      x: 1,
      y: 0
    };

    // 每一步最多改变一次方向
    let directionChangedThisStep = false;

    /* =========================
       三、初始化游戏
       ========================= */

    function resetGame() {
      // 停止上一局的定时器
      clearInterval(gameTimer);
      gameTimer = null;

      // 设置小蛇初始位置
      snake = [
        { x: 9, y: 10 },
        { x: 8, y: 10 },
        { x: 7, y: 10 }
      ];

      // 设置初始方向为向右
      direction = {
        x: 1,
        y: 0
      };

      nextDirection = {
        x: 1,
        y: 0
      };

      // 清空上一局的数据
      apple = null;
      watermelon = null;
      stones = [];
      growthRemaining = 0;

      // 分数归零
      score = 0;
      scoreElement.textContent = score;

      // 重置游戏状态
      gameStarted = false;
      gameOver = false;
      directionChangedThisStep = false;

      // 生成障碍物和水果
      createStones();
      createApple();
      createWatermelon();

      // 显示开始提示
      showMessage(
        "🐍",
        "准备出发！",
        "吃苹果加1格，吃西瓜加2格！"
      );

      // 绘制初始画面
      drawGame();
    }

    /* =========================
       四、开始游戏
       ========================= */

    function startGame() {
      // 已开始或已结束时不重复启动
      if (gameStarted || gameOver) {
        return;
      }

      gameStarted = true;
      hideMessage();

      // 每隔固定时间移动一次
      gameTimer = setInterval(
        updateGame,
        gameSpeed
      );
    }

    /* =========================
       五、更新游戏
       ========================= */

    function updateGame() {
      // 使用玩家准备好的方向
      direction = nextDirection;

      // 计算下一步蛇头位置
      const newHead = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      // 判断是否撞墙
      const hitWall =
        newHead.x < 0 ||
        newHead.x >= gridCount ||
        newHead.y < 0 ||
        newHead.y >= gridCount;

      // 判断是否吃到苹果
      const willEatApple =
        apple &&
        newHead.x === apple.x &&
        newHead.y === apple.y;

      // 判断是否吃到西瓜
      const willEatWatermelon =
        watermelon &&
        newHead.x === watermelon.x &&
        newHead.y === watermelon.y;

      /*
        如果本轮会增长，蛇尾不会移动。
        如果本轮不增长，蛇尾会向前移动一格。
      */
      const willGrow =
        willEatApple ||
        willEatWatermelon ||
        growthRemaining > 0;

      /*
        不增长时，可以忽略即将移动的最后一节蛇尾。
        增长时，需要检查完整蛇身。
      */
      const bodyToCheck = willGrow
        ? snake
        : snake.slice(0, snake.length - 1);

      // 判断是否撞到自己的身体
      const hitSelf = bodyToCheck.some(
        (part) =>
          part.x === newHead.x &&
          part.y === newHead.y
      );

      // 判断是否撞到石头
      const hitStone = stones.some(
        (stone) =>
          stone.x === newHead.x &&
          stone.y === newHead.y
      );

      // 撞墙、撞自己或撞石头都会失败
      if (hitWall || hitSelf || hitStone) {
        endGame(hitStone);
        return;
      }

      // 把新蛇头加入身体最前面
      snake.unshift(newHead);

      /* 处理吃苹果 */
      if (willEatApple) {
        // 苹果加10分
        addScore(10);

        // 苹果让蛇增长1格
        growthRemaining += 1;

        // 生成新苹果
        createApple();
      }

      /* 处理吃西瓜 */
      if (willEatWatermelon) {
        // 西瓜加20分
        addScore(20);

        // 西瓜让蛇增长2格
        growthRemaining += 2;

        // 生成新西瓜
        createWatermelon();
      }

      /*
        有待增长长度时，不删除蛇尾。

        每保留一次蛇尾，蛇就增长1格。
      */
      if (growthRemaining > 0) {
        growthRemaining -= 1;
      } else {
        // 不需要增长时删除蛇尾
        snake.pop();
      }

      // 本次移动完成，可以再次转向
      directionChangedThisStep = false;

      // 重新绘制画面
      drawGame();
    }

    /* =========================
       六、增加分数
       ========================= */

    function addScore(points) {
      score += points;
      scoreElement.textContent = score;

      // 更新最高分
      if (score > bestScore) {
        bestScore = score;
        bestScoreElement.textContent = bestScore;

        // 把最高分保存在浏览器中
        localStorage.setItem(
          "snakeBestScore",
          bestScore
        );
      }
    }

    /* =========================
       七、生成石头
       ========================= */

    function createStones() {
      stones = [];

      while (stones.length < stoneCount) {
        const newStone = getRandomPosition();

        // 石头不能出现在蛇身上
        const stoneOnSnake =
          isPositionOnSnake(newStone);

        // 石头不能互相重叠
        const stoneOnStone =
          isPositionInArray(newStone, stones);

        /*
          石头不能离初始蛇头太近，
          防止一开始就没有移动空间。
        */
        const tooCloseToHead =
          Math.abs(newStone.x - snake[0].x) <= 2 &&
          Math.abs(newStone.y - snake[0].y) <= 2;

        if (
          !stoneOnSnake &&
          !stoneOnStone &&
          !tooCloseToHead
        ) {
          stones.push(newStone);
        }
      }
    }

    /* =========================
       八、生成苹果
       ========================= */

    function createApple() {
      let newApple;
      let unavailable;

      do {
        newApple = getRandomPosition();

        unavailable =
          isPositionOnSnake(newApple) ||
          isPositionInArray(newApple, stones) ||
          isSamePosition(newApple, watermelon);
      } while (unavailable);

      apple = newApple;
    }

    /* =========================
       九、生成西瓜
       ========================= */

    function createWatermelon() {
      let newWatermelon;
      let unavailable;

      do {
        newWatermelon = getRandomPosition();

        unavailable =
          isPositionOnSnake(newWatermelon) ||
          isPositionInArray(newWatermelon, stones) ||
          isSamePosition(newWatermelon, apple);
      } while (unavailable);

      watermelon = newWatermelon;
    }

    /* =========================
       十、位置检查工具
       ========================= */

    // 随机生成一个棋盘位置
    function getRandomPosition() {
      return {
        x: Math.floor(Math.random() * gridCount),
        y: Math.floor(Math.random() * gridCount)
      };
    }

    // 判断位置是否在蛇身上
    function isPositionOnSnake(position) {
      return snake.some(
        (part) => isSamePosition(part, position)
      );
    }

    // 判断位置是否在某个数组中
    function isPositionInArray(position, array) {
      return array.some(
        (item) => isSamePosition(item, position)
      );
    }

    // 判断两个位置是否相同
    function isSamePosition(positionA, positionB) {
      if (!positionA || !positionB) {
        return false;
      }

      return (
        positionA.x === positionB.x &&
        positionA.y === positionB.y
      );
    }

    /* =========================
       十一、绘制游戏画面
       ========================= */

    function drawGame() {
      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      drawBackground();
      drawStones();
      drawApple();
      drawWatermelon();
      drawSnake();
    }

    /* 绘制棋盘背景 */
    function drawBackground() {
      for (let y = 0; y < gridCount; y++) {
        for (let x = 0; x < gridCount; x++) {
          ctx.fillStyle =
            (x + y) % 2 === 0
              ? "#eafff5"
              : "#ddfaed";

          ctx.fillRect(
            x * cellSize,
            y * cellSize,
            cellSize,
            cellSize
          );
        }
      }

      // 绘制浅色网格
      ctx.strokeStyle =
        "rgba(78, 174, 137, 0.08)";

      ctx.lineWidth = 1;

      for (let i = 0; i <= gridCount; i++) {
        const position = i * cellSize;

        ctx.beginPath();
        ctx.moveTo(position, 0);
        ctx.lineTo(position, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, position);
        ctx.lineTo(canvas.width, position);
        ctx.stroke();
      }
    }

    /* =========================
       十二、绘制石头
       ========================= */

    function drawStones() {
      stones.forEach((stone) => {
        const x = stone.x * cellSize;
        const y = stone.y * cellSize;

        // 石头阴影
        ctx.beginPath();

        ctx.ellipse(
          x + cellSize / 2,
          y + cellSize * 0.8,
          cellSize * 0.36,
          cellSize * 0.13,
          0,
          0,
          Math.PI * 2
        );

        ctx.fillStyle =
          "rgba(51, 65, 85, 0.2)";

        ctx.fill();

        // 石头主体
        ctx.beginPath();

        ctx.moveTo(
          x + cellSize * 0.14,
          y + cellSize * 0.72
        );

        ctx.lineTo(
          x + cellSize * 0.2,
          y + cellSize * 0.4
        );

        ctx.lineTo(
          x + cellSize * 0.4,
          y + cellSize * 0.18
        );

        ctx.lineTo(
          x + cellSize * 0.7,
          y + cellSize * 0.25
        );

        ctx.lineTo(
          x + cellSize * 0.88,
          y + cellSize * 0.55
        );

        ctx.lineTo(
          x + cellSize * 0.8,
          y + cellSize * 0.78
        );

        ctx.closePath();

        ctx.fillStyle = "#7c8799";
        ctx.fill();

        // 石头边框
        ctx.strokeStyle = "#566273";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // 石头高光
        ctx.beginPath();

        ctx.ellipse(
          x + cellSize * 0.43,
          y + cellSize * 0.37,
          cellSize * 0.13,
          cellSize * 0.07,
          -0.4,
          0,
          Math.PI * 2
        );

        ctx.fillStyle =
          "rgba(255, 255, 255, 0.45)";

        ctx.fill();
      });
    }

    /* =========================
       十三、绘制苹果
       ========================= */

    function drawApple() {
      if (!apple) {
        return;
      }

      const centerX =
        apple.x * cellSize + cellSize / 2;

      const centerY =
        apple.y * cellSize + cellSize / 2;

      // 苹果光晕
      ctx.beginPath();

      ctx.arc(
        centerX,
        centerY,
        cellSize * 0.45,
        0,
        Math.PI * 2
      );

      ctx.fillStyle =
        "rgba(255, 100, 135, 0.18)";

      ctx.fill();

      // 苹果主体
      ctx.beginPath();

      ctx.arc(
        centerX,
        centerY + 1,
        cellSize * 0.34,
        0,
        Math.PI * 2
      );

      ctx.fillStyle = "#ff668a";
      ctx.fill();

      // 苹果高光
      ctx.beginPath();

      ctx.arc(
        centerX - 4,
        centerY - 3,
        cellSize * 0.08,
        0,
        Math.PI * 2
      );

      ctx.fillStyle =
        "rgba(255, 255, 255, 0.75)";

      ctx.fill();

      // 苹果叶子
      ctx.save();

      ctx.translate(
        centerX + 2,
        centerY - 8
      );

      ctx.rotate(-0.45);

      ctx.beginPath();

      ctx.ellipse(
        4,
        0,
        5,
        2.5,
        0,
        0,
        Math.PI * 2
      );

      ctx.fillStyle = "#39b96d";
      ctx.fill();

      ctx.restore();
    }

    /* =========================
       十四、绘制西瓜
       ========================= */

    function drawWatermelon() {
      if (!watermelon) {
        return;
      }

      const centerX =
        watermelon.x * cellSize + cellSize / 2;

      const centerY =
        watermelon.y * cellSize + cellSize / 2;

      // 西瓜光晕
      ctx.beginPath();

      ctx.arc(
        centerX,
        centerY,
        cellSize * 0.48,
        0,
        Math.PI * 2
      );

      ctx.fillStyle =
        "rgba(85, 205, 115, 0.2)";

      ctx.fill();

      // 西瓜外皮
      ctx.beginPath();

      ctx.arc(
        centerX,
        centerY,
        cellSize * 0.38,
        0,
        Math.PI * 2
      );

      ctx.fillStyle = "#35b85f";
      ctx.fill();

      // 西瓜深色条纹
      ctx.strokeStyle = "#197c3b";
      ctx.lineWidth = 2;

      ctx.beginPath();

      ctx.arc(
        centerX,
        centerY,
        cellSize * 0.27,
        -Math.PI / 2,
        Math.PI / 2
      );

      ctx.stroke();

      ctx.beginPath();

      ctx.arc(
        centerX,
        centerY,
        cellSize * 0.27,
        Math.PI / 2,
        Math.PI * 1.5
      );

      ctx.stroke();

      // 西瓜浅色条纹
      ctx.strokeStyle = "#8bea9e";
      ctx.lineWidth = 1.5;

      ctx.beginPath();

      ctx.ellipse(
        centerX,
        centerY,
        cellSize * 0.12,
        cellSize * 0.35,
        0,
        0,
        Math.PI * 2
      );

      ctx.stroke();

      // 西瓜高光
      ctx.beginPath();

      ctx.arc(
        centerX - 4,
        centerY - 4,
        cellSize * 0.08,
        0,
        Math.PI * 2
      );

      ctx.fillStyle =
        "rgba(255, 255, 255, 0.7)";

      ctx.fill();
    }

    /* =========================
       十五、绘制小蛇
       ========================= */

    function drawSnake() {
      snake.forEach((part, index) => {
        const x = part.x * cellSize;
        const y = part.y * cellSize;

        if (index === 0) {
          // 绘制蛇头
          drawRoundedSquare(
            x + 1.5,
            y + 1.5,
            cellSize - 3,
            cellSize - 3,
            7,
            "#52d49c"
          );

          drawSnakeFace(x, y);
        } else {
          // 彩色蛇身
          const bodyColors = [
            "#6ddcaf",
            "#76d7f2",
            "#9b8cff",
            "#ff94bd",
            "#ffbd72"
          ];

          const bodyColor =
            bodyColors[
              (index - 1) % bodyColors.length
            ];

          drawRoundedSquare(
            x + 2,
            y + 2,
            cellSize - 4,
            cellSize - 4,
            6,
            bodyColor
          );

          // 蛇身高光
          ctx.beginPath();

          ctx.arc(
            x + cellSize * 0.38,
            y + cellSize * 0.35,
            2,
            0,
            Math.PI * 2
          );

          ctx.fillStyle =
            "rgba(255, 255, 255, 0.55)";

          ctx.fill();
        }
      });
    }

    /* 绘制蛇头眼睛 */
    function drawSnakeFace(x, y) {
      let eye1;
      let eye2;

      // 根据移动方向调整眼睛位置
      if (direction.x === 1) {
        eye1 = {
          x: x + 14,
          y: y + 6
        };

        eye2 = {
          x: x + 14,
          y: y + 14
        };
      } else if (direction.x === -1) {
        eye1 = {
          x: x + 6,
          y: y + 6
        };

        eye2 = {
          x: x + 6,
          y: y + 14
        };
      } else if (direction.y === -1) {
        eye1 = {
          x: x + 6,
          y: y + 6
        };

        eye2 = {
          x: x + 14,
          y: y + 6
        };
      } else {
        eye1 = {
          x: x + 6,
          y: y + 14
        };

        eye2 = {
          x: x + 14,
          y: y + 14
        };
      }

      [eye1, eye2].forEach((eye) => {
        // 白色眼球
        ctx.beginPath();

        ctx.arc(
          eye.x,
          eye.y,
          3.1,
          0,
          Math.PI * 2
        );

        ctx.fillStyle = "#ffffff";
        ctx.fill();

        // 黑色瞳孔
        ctx.beginPath();

        ctx.arc(
          eye.x,
          eye.y,
          1.4,
          0,
          Math.PI * 2
        );

        ctx.fillStyle = "#334155";
        ctx.fill();
      });
    }

    /* 绘制圆角方块 */
    function drawRoundedSquare(
      x,
      y,
      width,
      height,
      radius,
      color
    ) {
      ctx.beginPath();

      ctx.moveTo(x + radius, y);

      ctx.lineTo(
        x + width - radius,
        y
      );

      ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
      );

      ctx.lineTo(
        x + width,
        y + height - radius
      );

      ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
      );

      ctx.lineTo(
        x + radius,
        y + height
      );

      ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
      );

      ctx.lineTo(
        x,
        y + radius
      );

      ctx.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
      );

      ctx.closePath();

      ctx.fillStyle = color;
      ctx.fill();
    }

    /* =========================
       十六、改变移动方向
       ========================= */

    function changeDirection(directionName) {
      // 游戏结束后不能继续移动
      if (gameOver) {
        return;
      }

      // 第一次操作时开始游戏
      startGame();

      // 每次移动前最多转向一次
      if (directionChangedThisStep) {
        return;
      }

      let newDirection;

      if (directionName === "up") {
        newDirection = {
          x: 0,
          y: -1
        };
      } else if (directionName === "down") {
        newDirection = {
          x: 0,
          y: 1
        };
      } else if (directionName === "left") {
        newDirection = {
          x: -1,
          y: 0
        };
      } else if (directionName === "right") {
        newDirection = {
          x: 1,
          y: 0
        };
      } else {
        return;
      }

      // 禁止小蛇立即反方向移动
      const isOppositeDirection =
        newDirection.x === -direction.x &&
        newDirection.y === -direction.y;

      if (isOppositeDirection) {
        return;
      }

      nextDirection = newDirection;
      directionChangedThisStep = true;
    }

    /* =========================
       十七、游戏结束
       ========================= */

    function endGame(hitStone) {
      gameOver = true;
      gameStarted = false;

      clearInterval(gameTimer);
      gameTimer = null;

      if (hitStone) {
        showMessage(
          "🪨",
          "撞到石头啦！",
          `本次得分：${score}分<br>点击“重新开始”再挑战一次！`
        );
      } else {
        showMessage(
          "💫",
          "游戏结束",
          `本次得分：${score}分<br>点击“重新开始”再挑战一次！`
        );
      }
    }

    /* =========================
       十八、提示层控制
       ========================= */

    function showMessage(emoji, title, text) {
      messageEmoji.textContent = emoji;
      messageTitle.textContent = title;
      messageText.innerHTML = text;

      messageLayer.classList.remove("hidden");
    }

    function hideMessage() {
      messageLayer.classList.add("hidden");
    }

    /* =========================
       十九、电脑键盘操作
       ========================= */

    document.addEventListener(
      "keydown",
      (event) => {
        const key = event.key.toLowerCase();

        const gameKeys = [
          "arrowup",
          "arrowdown",
          "arrowleft",
          "arrowright",
          "w",
          "a",
          "s",
          "d"
        ];

        // 防止方向键让网页滚动
        if (gameKeys.includes(key)) {
          event.preventDefault();
        }

        if (
          key === "arrowup" ||
          key === "w"
        ) {
          changeDirection("up");
        } else if (
          key === "arrowdown" ||
          key === "s"
        ) {
          changeDirection("down");
        } else if (
          key === "arrowleft" ||
          key === "a"
        ) {
          changeDirection("left");
        } else if (
          key === "arrowright" ||
          key === "d"
        ) {
          changeDirection("right");
        }
      }
    );

    /* =========================
       二十、手机按钮操作
       ========================= */

    controlButtons.forEach((button) => {
      button.addEventListener(
        "pointerdown",
        (event) => {
          event.preventDefault();

          changeDirection(
            button.dataset.direction
          );
        }
      );
    });

    /* =========================
       二十一、手机滑动操作
       ========================= */

    let touchStartX = 0;
    let touchStartY = 0;

    canvas.addEventListener(
      "touchstart",
      (event) => {
        const touch = event.touches[0];

        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
      },
      {
        passive: false
      }
    );

    canvas.addEventListener(
      "touchmove",
      (event) => {
        // 防止页面跟着手指滚动
        event.preventDefault();
      },
      {
        passive: false
      }
    );

    canvas.addEventListener(
      "touchend",
      (event) => {
        const touch = event.changedTouches[0];

        const moveX =
          touch.clientX - touchStartX;

        const moveY =
          touch.clientY - touchStartY;

        // 最小滑动距离
        const minimumSwipeDistance = 20;

        if (
          Math.abs(moveX) < minimumSwipeDistance &&
          Math.abs(moveY) < minimumSwipeDistance
        ) {
          return;
        }

        // 判断主要滑动方向
        if (Math.abs(moveX) > Math.abs(moveY)) {
          if (moveX > 0) {
            changeDirection("right");
          } else {
            changeDirection("left");
          }
        } else {
          if (moveY > 0) {
            changeDirection("down");
          } else {
            changeDirection("up");
          }
        }
      },
      {
        passive: false
      }
    );

    /* =========================
       二十二、重新开始按钮
       ========================= */

    restartButton.addEventListener(
      "click",
      resetGame
    );

    /* =========================
       二十三、首次打开网页
       ========================= */

    resetGame();
  </script>
