/* ======================================================
   1. 页面基础样式
   ====================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;

    -webkit-tap-highlight-color: transparent;
}

body {

    min-height: 100vh;

    font-family:
        "Microsoft YaHei",
        "PingFang SC",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #fff2a8,
            #c8f7e7,
            #cde7ff

    color: #334155;

    padding: 16px 10px;

/* ======================================================
   2. 游戏主面板
   ====================================================== */

.game-app {

    width: min(98vw, 900px);

    margin: auto;

    background:
        rgba(255,255,255,0.96);

    border-radius: 28px;

    padding: 18px;

    box-shadow:
        0 15px 45px

    margin-bottom: 4px;

.subtitle {

    text-align: center;

    color: #718096;

    margin-bottom: 14px;

}


/* ======================================================
   3. 顶部信息栏
   ====================================================== */

.top-info {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 8px;

    margin-bottom: 12px;

}


.info-box {

    text-align: center;

    background: #f5fbff;

   4. 排行榜

    grid-template-columns:

    gap: 7px;

    margin-bottom: 12px;

.status-alive {

    font-weight: bold;

}


.status-dead {

    color: #ef4444;

    font-weight: bold;

}

   5. 游戏区域
   ====================================================== */

.canvas-container {

    position: relative;

    display: flex;

    justify-content: center;

}


canvas {

    width: min(100%, 700px);

    aspect-ratio: 1 / 1;

    background: #effcf5;

    border:

        6px solid
        #63ca96;

    border-radius: 22px;

    box-shadow:

        inset 0 0 20px
        rgba(45,150,95,0.08),

    touch-action: none;

/* ======================================================
   6. 游戏弹窗
   ====================================================== */

    top: 50%;

    gap: 7px;

    margin-bottom: 15px;

}

    border: 2px solid #d9e7ee;

    border-radius: 13px;

    padding: 9px 4px;

    font-size: 14px;

    color: #158757;

    font-weight: bold;

    height: 100%;

   9. 方向控制器
   ====================================================== */

.controls {

    width: 225px;

    grid-template-columns:

.control-btn {

#downBtn {

    grid-row: 2;

#rightBtn {

    grid-row: 2;

   10. 底部说明
   ====================================================== */

<script id="ai-lab-responsive-runtime">
(() => {
  const root = document.documentElement;
  const mobileUa = /Android|webOS|iPhone|iPad|iPod|Mobile|IEMobile|Opera Mini/i.test(navigator.userAgent || "");
  const coarsePointer = window.matchMedia?.("(hover: none) and (pointer: coarse)")?.matches || false;
  const updateLayoutMode = () => {
    const narrowScreen = window.innerWidth <= 768;
    const touchTablet = coarsePointer && window.innerWidth <= 1024;
    const mobileDevice = mobileUa && window.innerWidth <= 1180;
    const useH5 = narrowScreen || touchTablet || mobileDevice;
    root.classList.toggle("ai-lab-h5", useH5);
    root.classList.toggle("ai-lab-web", !useH5);
    root.dataset.layoutMode = useH5 ? "h5" : "web";
  };
  updateLayoutMode();
  window.addEventListener("resize", updateLayoutMode, { passive: true });
  window.addEventListener("orientationchange", updateLayoutMode, { passive: true });
})();
</script>

/* ======================================================
   10. 游戏主循环
   ====================================================== */

function gameLoop() {


if (!gameRunning) {

    return;

}


animationFrame++;


/* 让AI先选择方向 */

snakes.forEach(

snake => {

    if (
        snake.alive
        &&
        !snake.player
    ) {

        chooseAIDirection(
            snake
        );

    }

}

);


/* 计算所有新蛇头 */

const newHeads = [];


snakes.forEach(

snake => {


if (!snake.alive) {

    newHeads.push(
        null
    );

    return;

}


snake.direction = {

    ...snake.nextDirection

};


const head =
    snake.body[0];


newHeads.push({

    x:
        head.x
        +
        snake.direction.x,

    y:
        head.y
        +
        snake.direction.y

});


}

);


/* ==================================================
   11. 碰撞判断
   ================================================== */

snakes.forEach(

(snake,index) => {


if (!snake.alive) {

    return;

}


const head =

    newHeads[index];


/* ------------------------------
   撞墙
   ------------------------------ */

if (

    head.x < 0

    ||

    head.x >=
    TILE_COUNT

    ||

    head.y < 0

    ||

    head.y >=
    TILE_COUNT

) {

    killSnake(
        snake
    );

    return;

}


/* ------------------------------
   撞到任意存活蛇身体
   ------------------------------ */

for (
    const otherSnake
    of snakes
) {


if (!otherSnake.alive) {

    continue;

}


for (

    let i = 0;

    i <
    otherSnake.body.length;

    i++

) {


const part =

    otherSnake.body[i];


if (

    head.x ===
    part.x

    &&

    head.y ===
    part.y

) {

    killSnake(
        snake
    );

    return;

}


}


}


}

);



/* ==================================================
   12. 两条蛇正面撞头
   ================================================== */

for (

let i = 0;

i < snakes.length;

i++

) {


for (

let j = i + 1;

j < snakes.length;

j++

) {


if (

    !snakes[i].alive

    ||

    !snakes[j].alive

) {

    continue;

}


if (

    newHeads[i]

    &&

    newHeads[j]

    &&

    newHeads[i].x ===
    newHeads[j].x

    &&

    newHeads[i].y ===
    newHeads[j].y

) {

    killSnake(
        snakes[i]
    );

    killSnake(
        snakes[j]
    );

}


}


}



/* ==================================================
   13. 更新活着的蛇
   ================================================== */

snakes.forEach(

(snake,index) => {


if (!snake.alive) {

    return;

}


/* 保存运动轨迹 */

snake.trail.push({

    x:
        snake.body[0].x,

    y:
        snake.body[0].y,

    life:
        30

});


/* 限制轨迹数量 */

if (
    snake.trail.length
    >
    45
) {

    snake.trail.shift();

}


/* 添加新蛇头 */

snake.body.unshift(

    newHeads[index]

);


/* 检查吃食物 */

let eatenIndex =
    -1;


foods.forEach(

(food,foodIndex) => {


if (

    food.x ===
    newHeads[index].x

    &&

    food.y ===
    newHeads[index].y

) {

    eatenIndex =
        foodIndex;

}


}

);


/* 吃到了 */

if (
    eatenIndex !== -1
) {


const eatenFood =

    foods[
        eatenIndex
    ];


/* --------------------------
   星星：
   +30分
   +2长度
   -------------------------- */

if (
    eatenFood.type ===
    "star"
) {

    snake.score +=
        30;


    /*

    新蛇头本身已经增加1格。

    再复制一个尾巴，

    相当于总共长2格。

    */

    const tail =

        snake.body[
            snake.body.length - 1
        ];


    snake.body.push({

        x: tail.x,

        y: tail.y

    });

}


/* --------------------------
   苹果：
   +10分
   +1长度
   -------------------------- */

else {

    snake.score +=
        10;

}


/* 删除吃掉的食物 */

foods.splice(

    eatenIndex,

    1

);


/* 重新生成同类型食物 */

createFood(

    eatenFood.type

);


}


/* 没吃到食物 */

else {


/*

删除尾巴，

保持长度不变。

*/

snake.body.pop();


}


}

);



/* ==================================================
   14. 轨迹逐渐消失
   ================================================== */

snakes.forEach(

snake => {


snake.trail.forEach(

point => {

    point.life--;

}

);


snake.trail =

snake.trail.filter(

point =>
    point.life > 0

);


}

);


/* 更新画面 */

updateUI();

drawGame();


/* 所有蛇都死了 */

const aliveCount =

snakes.filter(

snake =>
    snake.alive

).length;


if (
    aliveCount === 0
) {

    finishGame();

}


}



/* ======================================================
   15. AI电脑蛇逻辑
   ====================================================== */

function chooseAIDirection(
    snake
) {


/*

AI特点：

1. 找附近食物
2. 躲墙
3. 躲蛇
4. 有时主动转弯
5. 不会一直走直线

*/


const possibleDirections = [

    {x:1,y:0},

    {x:-1,y:0},

    {x:0,y:1},

    {x:0,y:-1}

];


let candidates =
    [];


/* 检查安全方向 */

possibleDirections.forEach(

direction => {


/* 不能直接180度回头 */

if (

    direction.x ===
    -snake.direction.x

    &&

    direction.y ===
    -snake.direction.y

) {

    return;

}


const nextPosition = {

    x:
        snake.body[0].x
        +
        direction.x,

    y:
        snake.body[0].y
        +
        direction.y

};


if (

    isSafePosition(
        nextPosition
    )

) {


let score = 0;


/* --------------------------
   远离地图边缘
   -------------------------- */

const wallDistance =

Math.min(

    nextPosition.x,

    TILE_COUNT
    -
    1
    -
    nextPosition.x,

    nextPosition.y,

    TILE_COUNT
    -
    1
    -
    nextPosition.y

);


score +=

    wallDistance
    *
    0.7;


/* --------------------------
   找最近的食物
   -------------------------- */

let nearestDistance =
    Infinity;


foods.forEach(

food => {


const distance =

Math.abs(

    nextPosition.x
    -
    food.x

)

+

Math.abs(

    nextPosition.y
    -
    food.y

);


if (
    distance <
    nearestDistance
) {

    nearestDistance =
        distance;

}


}

);


score -=

    nearestDistance
    *
    1.2;


/* --------------------------
   向前继续有一点奖励
   -------------------------- */

if (

    direction.x ===
    snake.direction.x

    &&

    direction.y ===
    snake.direction.y

) {

    score +=
        1.8;

}


/* --------------------------
   随机性

   让每条蛇看起来
   更活灵活现。
   -------------------------- */

score +=

    Math.random()
    *
    8;


/* --------------------------
   AI有一定几率主动转弯

   不会永远直走。
   -------------------------- */

if (

    (
        direction.x !==
        snake.direction.x

        ||

        direction.y !==
        snake.direction.y
    )

    &&

    Math.random() <
    0.35

) {

    score +=
        5;

}


candidates.push({

    direction,

    score

});


}


}

);


/* 没有安全方向 */

if (
    candidates.length === 0
) {

    return;

}


/* 按评分排序 */

candidates.sort(

(a,b) =>
    b.score
    -
    a.score

);


/*

多数时候选最好路线，

偶尔选择第二好路线，

让AI路线更自然。

*/

let chosen;


if (

    candidates.length > 1

    &&

    Math.random() <
    0.22

) {

    chosen =
        candidates[1];

}

else {

    chosen =
        candidates[0];

}


snake.nextDirection = {

    ...chosen.direction

};


}



/* ======================================================
   16. 判断位置是否安全
   ====================================================== */

function isSafePosition(
    position
) {


/* 撞墙 */

if (

    position.x < 0

    ||

    position.x >=
    TILE_COUNT

    ||

    position.y < 0

    ||

    position.y >=
    TILE_COUNT

) {

    return false;

}


/* 撞其他蛇 */

for (
    const snake
    of snakes
) {


if (!snake.alive) {

    continue;

}


for (
    const part
    of snake.body
) {


if (

    part.x ===
    position.x

    &&

    part.y ===
    position.y

) {

    return false;

}


}


}


return true;


}



/* ======================================================
   17. 蛇被淘汰
   ====================================================== */

function killSnake(

if (!snake.alive) {

}

    false;


snake.deathTimer =
    18;

/* ======================================================
   18. 玩家改变方向
   ====================================================== */

function changePlayerDirection(
    x,
    y
) {


if (!gameRunning) {

    return;

}


const player =
    snakes[0];


if (
    !player
    ||
    !player.alive
) {

    return;

}


/* 禁止180度直接回头 */

if (

    x ===
    -player.direction.x

    &&

    y ===
    -player.direction.y

) {

    return;

}


player.nextDirection = {

    x,

    y

};


}

/* ======================================================
   21. 手机滑动控制
   ====================================================== */

let touchStartX =
    0;


let touchStartY =
    0;


canvas.addEventListener(

"touchstart",

event => {


const touch =
    event.touches[0];


touchStartX =
    touch.clientX;


touchStartY =
    touch.clientY;


},

{
    passive:true
}

);



canvas.addEventListener(

"touchend",

event => {


const touch =

    event.changedTouches[0];


const dx =

    touch.clientX
    -
    touchStartX;


const dy =

    touch.clientY
    -
    touchStartY;


/* 滑动距离太短 */

if (

    Math.abs(dx) < 18

    &&

    Math.abs(dy) < 18

) {

    return;

}


/* 左右滑动 */

if (

    Math.abs(dx)
    >
    Math.abs(dy)

) {


if (dx > 0) {

    changePlayerDirection(
        1,
        0
    );

}
else {

    changePlayerDirection(
        -1,
        0
    );

}


}


/* 上下滑动 */

else {


if (dy > 0) {

    changePlayerDirection(
        0,
        1
    );

}
else {

    changePlayerDirection(
        0,
        -1
    );

}


}


},

{
    passive:true
}

);



/* ======================================================
   22. 创建食物
   ====================================================== */

function createFood(
    type
) {


let position;


let valid =
    false;


let attempts =
    0;


while (
    !valid
    &&
    attempts < 500
) {


attempts++;


position = {

    x:
        Math.floor(
            Math.random()
            *
            TILE_COUNT
        ),

    y:
        Math.floor(
            Math.random()
            *
            TILE_COUNT
        )

};


valid =
    true;


/* 不能生成在蛇身体上 */

for (
    const snake
    of snakes
) {


for (
    const part
    of snake.body
) {


if (

    part.x ===
    position.x

    &&

    part.y ===
    position.y

) {

    valid =
        false;

}


}


}


/* 不能和其他食物重合 */

for (
    const food
    of foods
) {


if (

    food.x ===
    position.x

    &&

    food.y ===
    position.y

) {

    valid =
        false;

}


}


}


/* 成功生成 */

if (valid) {


foods.push({

    x:
        position.x,

    y:
        position.y,

    type

});


}


}

/* ======================================================
   24. 地图背景
   ====================================================== */

function drawBackground() {


for (

let y = 0;

y < TILE_COUNT;

y++

) {


for (

let x = 0;

x < TILE_COUNT;

x++

) {


ctx.fillStyle =

(x+y)%2 === 0

?

"#effdf5"

:

"#e8faef";


ctx.fillRect(

    x * GRID,

    y * GRID,

    GRID,

    GRID

);


}


}


/* 淡淡的网格 */

ctx.strokeStyle =

    "rgba(60,135,95,0.07)";


ctx.lineWidth =
    1;


for (

let i = 0;

i <= TILE_COUNT;

i++

) {


ctx.beginPath();

ctx.moveTo(
    i*GRID,
    0
);

ctx.lineTo(
    i*GRID,
    canvas.height
);

ctx.stroke();


ctx.beginPath();

ctx.moveTo(
    0,
    i*GRID
);

ctx.lineTo(
    canvas.width,
    i*GRID
);

ctx.stroke();


}


}



/* ======================================================
   25. 绘制清晰轨迹
   ====================================================== */

function drawTrail(
    snake
) {


snake.trail.forEach(

point => {


const alpha =

    Math.max(
        0,
        point.life / 30
    );


ctx.globalAlpha =

    alpha
    *
    0.25;


ctx.fillStyle =

    snake.darkColor;


ctx.beginPath();


ctx.arc(

    point.x * GRID
    +
    GRID / 2,

    point.y * GRID
    +
    GRID / 2,

    4.5,

    0,

    Math.PI * 2

);


ctx.fill();


}

);


ctx.globalAlpha =
    1;


}



/* ======================================================
   26. 绘制蛇
   ====================================================== */

function drawSnake(
    snake
) {


/* 淘汰蛇变透明 */

if (!snake.alive) {

    ctx.globalAlpha =
        0.25;

}


/* 从尾巴向头画 */

for (

let i =
    snake.body.length - 1;

i >= 0;

i--

) {


const part =
    snake.body[i];


const x =
    part.x * GRID;


const y =
    part.y * GRID;


/* 蛇头 */

if (i === 0) {

    ctx.fillStyle =
        snake.darkColor;

}


/* 蛇身体 */

else {

    ctx.fillStyle =
        snake.color;

}


/* 身体轻微变化大小 */

const wiggle =

    i % 2 === 0

    ?

    1

    :

    0;


roundedRect(

    x + 2 + wiggle,

    y + 2 + wiggle,

    GRID - 4 - wiggle*2,

    GRID - 4 - wiggle*2,

    7

);


ctx.fill();


/* 白色描边 */

ctx.strokeStyle =

    "rgba(255,255,255,0.85)";


ctx.lineWidth =
    1.3;


ctx.stroke();


/* 头部 */

if (i === 0) {

    drawSnakeFace(
        snake,
        x,
        y
    );

}


}


/* 恢复透明度 */

ctx.globalAlpha =
    1;


}



/* ======================================================
   27. 绘制活灵活现的蛇脸
   ====================================================== */

function drawSnakeFace(
    snake,
    x,
    y
) {


const direction =
    snake.direction;


/* 眼睛位置 */

let eye1;

let eye2;


/* 向右 */

if (
    direction.x === 1
) {

    eye1 =
        {x:x+14,y:y+6};

    eye2 =
        {x:x+14,y:y+14};

}


/* 向左 */

else if (
    direction.x === -1
) {

    eye1 =
        {x:x+6,y:y+6};

    eye2 =
        {x:x+6,y:y+14};

}


/* 向上 */

else if (
    direction.y === -1
) {

    eye1 =
        {x:x+6,y:y+6};

    eye2 =
        {x:x+14,y:y+6};

}


/* 向下 */

else {

    eye1 =
        {x:x+6,y:y+14};

    eye2 =
        {x:x+14,y:y+14};

}


/* 白色眼球 */

ctx.fillStyle =
    "#ffffff";


ctx.beginPath();


ctx.arc(

    eye1.x,
    eye1.y,

    3,

    0,

    Math.PI*2

);


ctx.arc(

    eye2.x,
    eye2.y,

    3,

    0,

    Math.PI*2

);


ctx.fill();



/* 黑色眼珠 */

ctx.fillStyle =
    "#20303a";


ctx.beginPath();


ctx.arc(

    eye1.x
    +
    direction.x,

    eye1.y
    +
    direction.y,

    1.3,

    0,

    Math.PI*2

);


ctx.arc(

    eye2.x
    +
    direction.x,

    eye2.y
    +
    direction.y,

    1.3,

    0,

    Math.PI*2

);


ctx.fill();



/* 小舌头偶尔伸出来 */

if (

    snake.alive

    &&

    animationFrame % 10
    <
    5

) {


ctx.strokeStyle =
    "#ff4569";


ctx.lineWidth =
    1.5;


ctx.beginPath();


const centerX =
    x + GRID/2;


const centerY =
    y + GRID/2;


ctx.moveTo(

    centerX
    +
    direction.x * 7,

    centerY
    +
    direction.y * 7

);


ctx.lineTo(

    centerX
    +
    direction.x * 12,

    centerY
    +
    direction.y * 12

);


ctx.stroke();


}


}



/* ======================================================
   28. 绘制食物
   ====================================================== */

function drawFood(
    food
) {


const cx =

    food.x * GRID
    +
    GRID/2;


const cy =

    food.y * GRID
    +
    GRID/2;


/* 星星 */

if (
    food.type ===
    "star"
) {


drawStar(

    cx,

    cy,

    5,

    8,

    4

);


}


/* 苹果 */

else {


ctx.fillStyle =
    "#ff5964";


ctx.beginPath();


ctx.arc(

    cx,

    cy + 1,

    7,

    0,

    Math.PI*2

);


ctx.fill();



/* 苹果高光 */

ctx.fillStyle =

    "rgba(255,255,255,0.7)";


ctx.beginPath();


ctx.arc(

    cx - 2,

    cy - 2,

    2,

    0,

    Math.PI*2

);


ctx.fill();



/* 叶子 */

ctx.fillStyle =
    "#30ac69";


ctx.beginPath();


ctx.ellipse(

    cx + 4,

    cy - 7,

    4,

    2,

    -0.5,

    0,

    Math.PI*2

);


ctx.fill();


}


}



/* ======================================================
   29. 星星绘制工具
   ====================================================== */

function drawStar(

cx,

cy,

spikes,

outerRadius,

innerRadius

) {


let rotation =

    Math.PI / 2 * 3;


const step =

    Math.PI / spikes;


ctx.beginPath();


ctx.moveTo(

    cx,

    cy - outerRadius

);


for (

let i = 0;

i < spikes;

i++

) {


let x =

    cx
    +
    Math.cos(rotation)
    *
    outerRadius;


let y =

    cy
    +
    Math.sin(rotation)
    *
    outerRadius;


ctx.lineTo(
    x,
    y
);


rotation +=
    step;


x =

    cx
    +
    Math.cos(rotation)
    *
    innerRadius;


y =

    cy
    +
    Math.sin(rotation)
    *
    innerRadius;


ctx.lineTo(
    x,
    y
);


rotation +=
    step;


}


ctx.closePath();


ctx.fillStyle =
    "#ffd02e";


ctx.fill();


ctx.strokeStyle =
    "#f4a51d";


ctx.lineWidth =
    1.5;


ctx.stroke();


}



/* ======================================================
   30. 圆角矩形
   ====================================================== */

function roundedRect(

x,

y,

width,

height,

radius

) {


ctx.beginPath();


ctx.roundRect(

    x,

    y,

    width,

    height,

    radius

);


}



/* ======================================================
   31. 更新排行榜
   ====================================================== */

function updateUI() {


if (
    snakes.length === 0
) {

    return;

}


const player =
    snakes[0];


myScore.textContent =

    player.score;


myLength.textContent =

    player.body.length;


/* 每条蛇 */

snakes.forEach(

(snake,index) => {


const element =

    document.getElementById(

        "rank"
        +
        index

    );


const status =

    snake.alive

    ?

    '<span class="status-alive">✅存活</span>'

    :

    '<span class="status-dead">💥淘汰</span>';


element.innerHTML =

    "长度 "
    +
    snake.body.length

    +
    "　"
    +
    status

    +
    "<br>"

    +
    snake.score

    +
    "分";


}

);


}



/* ======================================================
   32. 游戏结束
   ====================================================== */

function finishGame() {


if (!gameRunning) {

    return;

}


gameRunning =
    false;


clearInterval(
    gameTimer
);


clearInterval(
    countdownTimer
);


timeLeft =

    Math.max(
        0,
        timeLeft
    );


timeText.textContent =
    timeLeft;


/* 按长度排序 */

const ranking =

[...snakes]

.sort(

(a,b) => {


/* 首先比较长度 */

if (

    b.body.length !==
    a.body.length

) {

    return

        b.body.length
        -
        a.body.length;

}


/* 长度一样时比较分数 */

return

    b.score
    -
    a.score;


}

);


/* 冠军 */

const champion =

    ranking[0];


let title;


/* 玩家赢 */

if (
    champion.player
) {

    title =
        "🏆 你成为蛇王啦！";

}


/* AI赢 */

else {

    title =

        "👑 "
        +
        champion.name
        +
        " 获得冠军！";

}


let text =

    "最终按蛇的长度排名："

    +
    "<br><br>";


ranking.forEach(

(snake,index) => {


const medals =

[
    "🥇",
    "🥈",
    "🥉",
    "4️⃣"
];


text +=

    medals[index]

    +
    " "

    +
    snake.name

    +
    "：长度 "

    +
    snake.body.length

    +
    "，"

    +
    snake.score

    +
    "分"

    +
    (

        snake.alive

        ?

        " ✅"

        :

        " 💥"

    )

    +

    "<br>";


}

);


document
.getElementById(
    "resultTitle"
)
.innerHTML =
    title;


document
.getElementById(
    "resultText"
)
.innerHTML =
    text;


gameOverOverlay.style.display =
    "block";


}
