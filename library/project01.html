<script id="ai-lab-responsive-runtime">
(() => {
  const root = document.documentElement;
  const mobileUa = /Android|webOS|iPhone|iPad|iPod|Mobile|IEMobile|Opera Mini/i.test(navigator.userAgent || "");
  const coarsePointer = window.matchMedia?.("(hover: none) and (pointer: coarse)")?.matches || false;
  const updateLayoutMode = () => {
    const narrowScreen = window.innerWidth <= 768;
    const touchTablet = coarsePointer && window.innerWidth <= 1024;
    const mobileDevice = mobileUa && window.innerWidth <= 1180;
    const useH5 = narrowScreen || touchTablet || mobileDevice;
    root.classList.toggle("ai-lab-h5", useH5);
    root.classList.toggle("ai-lab-web", !useH5);
    root.dataset.layoutMode = useH5 ? "h5" : "web";
  };
  updateLayoutMode();
  window.addEventListener("resize", updateLayoutMode, { passive: true });
  window.addEventListener("orientationchange", updateLayoutMode, { passive: true });
})();
</script>

    const loanStatus=loan=>{if(loan.returnedAt)return{label:'已归还',cls:''};const left=daysLeft(loan.dueAt);return left<0?{label:'已逾期 '+Math.abs(left)+' 天',cls:'danger'}:left<=3?{label:left===0?'今天到期':'还剩 '+left+' 天',cls:'warn'}:{label:'还剩 '+left+' 天',cls:''}};
    function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2200)}
    function setLoginRole(role){loginRole=role;document.querySelectorAll('[data-login-role]').forEach(btn=>btn.classList.toggle('active',btn.dataset.loginRole===role));$('accountLabel').textContent=role==='member'?'会员号':'管理员账号';$('accountInput').placeholder=role==='member'?'请输入会员号':'请输入管理员账号';$('demoText').innerHTML=role==='member'?'<b>会员演示账号</b><br>DEMO001 / 123456':'<b>管理员演示账号</b><br>admin01 / admin123';$('loginBtn').textContent=role==='member'?'登录并查看借阅':'进入管理员工作台';$('loginError').textContent='';}
    document.querySelectorAll('[data-login-role]').forEach(btn=>btn.onclick=()=>setLoginRole(btn.dataset.loginRole));
    $('loginBtn').onclick=()=>{const account=$('accountInput').value.trim(),password=$('passwordInput').value;let valid=false;if(loginRole==='admin')valid=account==='admin01'&&password==='admin123';else valid=state.members.some(item=>item.id===account&&item.pin===password);if(!valid){$('loginError').textContent='账号或密码不正确，请使用演示账号。';return}state.session=loginRole==='admin'?{role:'admin'}:{role:'member',memberId:account};save();tab=loginRole==='admin'?'总览':'首页';openApp();};
    $('passwordInput').addEventListener('keydown',event=>{if(event.key==='Enter')$('loginBtn').click()});
    $('logoutBtn').onclick=()=>{state.session=null;save();$('appShell').classList.add('hidden');$('loginScreen').classList.remove('hidden');$('passwordInput').value='';};
    function openApp(){$('loginScreen').classList.add('hidden');$('appShell').classList.remove('hidden');$('roleBadge').textContent=state.session.role==='admin'?'管理员端':'会员端';render();}
    function navItems(){return state.session.role==='admin'?[['总览','▥'],['借阅','▤'],['提醒','◉'],['活动','☆'],['管理','⚙']]:[['首页','⌂'],['借阅','▤'],['打卡','✎'],['奖励','🐾'],['我的','○']]}
    function renderNav(){$('bottomNav').innerHTML=navItems().map(([name,icon])=>`<button class="nav-btn ${tab===name?'active':''}" data-tab="${name}"><span>${icon}</span>${name}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(btn=>btn.onclick=()=>{tab=btn.dataset.tab;render()})}
    function loanCard(loan,admin=false){const status=loanStatus(loan),owner=state.members.find(item=>item.id===loan.memberId);return`<article class="card loan"><div class="book-cover">📖</div><div><span class="status ${status.cls}">${status.label}</span><h3>《${esc(loan.title)}》</h3><p>${esc(loan.author||'作者未登记')} · ${esc(loan.bookCode)}${admin?'<br>借阅人：'+esc(owner?.name||loan.memberId)+'（'+esc(loan.memberId)+'）':''}</p><p>借阅 ${fmt(loan.borrowedAt)} · 应还 ${fmt(loan.dueAt)}</p><div class="loan-actions">${!loan.returnedAt&&admin?`<button class="small-btn solid" data-return="${loan.id}">登记归还</button><button class="small-btn" data-remind="${loan.id}">发送提醒</button>`:''}</div></div></article>`}
    function memberHome(){const me=member(),current=activeLoans(me.id),urgent=current.slice().sort((a,b)=>daysLeft(a.dueAt)-daysLeft(b.dueAt))[0],checks=state.checkins.filter(item=>item.memberId===me.id);return`<section class="hero"><div><p class="eyebrow">MEMBER READING SPACE</p><h2>你好，${esc(me.name)}</h2><p>今天也一起读一点。借阅日期、归还提醒和阅读记录都会保存在当前浏览器。</p></div><div class="grid-3"><div class="stat"><strong>${current.length}</strong><span>当前借阅</span></div><div class="stat"><strong>${checks.length}</strong><span>阅读记录</span></div><div class="stat"><strong>${checks.length*state.settings.checkinPoints}</strong><span>阅读阳光</span></div></div></section>${urgent?`<button class="alert ${daysLeft(urgent.dueAt)<0?'red':''}" data-go="借阅"><span class="alert-icon">${daysLeft(urgent.dueAt)<0?'⚠️':'⏰'}</span><div><h3>《${esc(urgent.title)}》${loanStatus(urgent).label}</h3><p>应还日期：${fmt(urgent.dueAt)}，点击查看详情</p></div></button>`:''}<div class="section-head"><h3>常用功能</h3></div><div class="quick-grid"><button class="quick" data-go="借阅"><i>▤</i><b>我的借阅</b><small>${current.length} 本在借</small></button><button class="quick" data-go="打卡"><i>✎</i><b>阅读打卡</b><small>留下今天的想法</small></button><button class="quick" data-go="奖励"><i>🐾</i><b>小猫伙伴</b><small>${state.pet.food} 条小鱼干</small></button></div><div class="section-head"><h3>最近提醒</h3></div>${state.reminders.filter(item=>item.memberId===me.id).slice(0,3).map(item=>`<div class="card note"><b>◉ ${esc(item.message)}</b><p>${fmt(item.sentAt)} · ${item.status}</p></div>`).join('')||'<div class="card empty"><span>✓</span><h3>暂无新提醒</h3><p>归还提醒会显示在这里</p></div>'}`}
    function memberLoans(){const me=member(),items=state.loans.filter(item=>item.memberId===me.id);return`<div class="section-head"><div><h2>我的借阅</h2><p>每次最多借 ${state.settings.loanLimit} 本，期限 ${state.settings.loanDays} 天</p></div></div><div class="list two">${items.length?items.map(item=>loanCard(item)).join(''):'<div class="card empty"><span>📚</span><h3>还没有借阅记录</h3><p>管理员登记后会显示在这里</p></div>'}</div>`}
    function memberCheckin(){const me=member(),current=activeLoans(me.id),today=state.checkins.some(item=>item.memberId===me.id&&item.checkinDay===dateOffset(0));return`<section class="hero"><div><p class="eyebrow">TODAY READING</p><h2>${today?'今天的阅读记录已保存':'留下这一页的想法'}</h2><p>每天只能有效打卡一次；写清读到了什么，以及自己的感受。</p></div></section><div class="section-head"><h3>今日阅读</h3></div><div class="card form-card"><div class="field"><label>正在读的书</label><select id="checkBook"><option value="">请选择一本书</option>${current.map(item=>`<option>${esc(item.title)}</option>`).join('')}<option>自由阅读</option></select></div><div class="field"><label>阅读时长</label><div class="choice-row">${[15,30,45,60].map(value=>`<button class="${minutes===value?'active':''}" data-minutes="${value}">${value} 分钟</button>`).join('')}</div></div><div class="field"><label>阅读感受</label><textarea id="feeling" maxlength="200" placeholder="例如：我读到主角帮助朋友的这一段，觉得他虽然害怕但很勇敢。"></textarea><span class="counter">至少12个字</span></div><button class="primary wide" id="checkinBtn" ${today?'disabled':''}>${today?'今天已完成，明天再来':'完成今日打卡，获得小鱼干 🐟'}</button></div><div class="section-head"><h3>最近阅读</h3></div><div class="list">${state.checkins.filter(item=>item.memberId===me.id).slice(0,5).map(item=>`<div class="card note"><b>《${esc(item.bookTitle)}》 · ${item.minutes}分钟</b><p>${esc(item.feeling)}<br>${fmt(item.checkinDay)}</p></div>`).join('')}</div>`}
    function memberRewards(){const me=member(),checks=state.checkins.filter(item=>item.memberId===me.id),days=new Set(checks.map(item=>item.checkinDay));return`<div class="grid-3"><div class="stat"><strong>${checks.length*state.settings.checkinPoints}</strong><span>阅读阳光</span></div><div class="stat"><strong>${checks.length}</strong><span>阅读记录</span></div><div class="stat"><strong>${state.pet.energy}</strong><span>小阅精神值</span></div></div><div class="section-head"><h3>我的阅读伙伴</h3></div><section class="card pet-room"><h2>${esc(state.pet.name)} · ${esc(state.pet.stage)}</h2><p id="petSpeech">${state.pet.hungry?'我有点饿啦！':'陪我一起读书吧！'}</p><div class="pet" id="pet">🐱</div><div class="inventory"><span>🐟 ${state.pet.food}</span><span>🧶 ${state.pet.toys}</span></div><div class="choice-row" style="justify-content:center"><button data-pet="feed">🐟 喂食</button><button data-pet="pet">♡ 摸摸</button><button data-pet="play">🧶 玩耍</button></div></section><div class="section-head"><h3>七日阅读轨迹</h3></div><div class="calendar">${Array.from({length:28},(_,index)=>{const day=dateOffset(index-27);return`<span class="day ${days.has(day)?'read':''}">${new Date(day+'T12:00:00').getDate()}</span>`}).join('')}</div>`}
    function memberProfile(){const me=member();return`<div class="card note"><b style="font-size:22px">${esc(me.name)}</b><p>会员号 ${esc(me.id)} · 有效期至 ${fmt(me.expiresAt)}</p></div><div class="section-head"><h3>我的设置</h3></div><div class="list"><div class="card setting"><div><b>归还提醒</b><small>到期前和逾期后醒目提示</small></div><span class="status">已开启</span></div><div class="card setting"><div><b>隐私保护</b><small>不设置公开儿童排行榜</small></div><span class="status">本机保存</span></div></div><button class="danger wide" id="resetBtn">重新开始演示</button>`}
    function adminOverview(){const active=state.loans.filter(item=>!item.returnedAt),overdue=active.filter(item=>daysLeft(item.dueAt)<0),soon=active.filter(item=>daysLeft(item.dueAt)>=0&&daysLeft(item.dueAt)<=3);return`<section class="hero"><div><p class="eyebrow">LIBRARIAN PORTAL</p><h2>管理员总览</h2><p>维护借阅记录，及时发送归还提醒。</p></div><div class="grid-3"><div class="stat"><strong>${active.length}</strong><span>当前借阅</span></div><div class="stat"><strong>${overdue.length}</strong><span>逾期</span></div><div class="stat"><strong>${soon.length}</strong><span>即将到期</span></div></div></section><div class="section-head"><h3>需要关注</h3></div><div class="list">${[...overdue,...soon].map(item=>loanCard(item,true)).join('')||'<div class="card empty"><span>✓</span><h3>当前没有紧急提醒</h3><p>借阅情况正常</p></div>'}</div>`}
    function adminLoans(){return`<div class="section-head"><div><h2>借阅登记</h2><p>为会员新增真实借阅记录</p></div></div><form class="card admin-form" id="loanForm"><div class="field"><label>借阅会员</label><select name="memberId">${state.members.map(item=>`<option value="${item.id}">${esc(item.name)}（${item.id}）</option>`).join('')}</select></div><div class="field"><label>借阅天数</label><input name="days" type="number" min="1" max="90" value="${state.settings.loanDays}"></div><div class="field"><label>书名</label><input name="title" required placeholder="请输入书名"></div><div class="field"><label>作者</label><input name="author" placeholder="作者"></div><div class="field full"><label>图书编号</label><input name="bookCode" required placeholder="例如 TS-108"></div><button class="primary full" type="submit">登记借阅</button></form><div class="section-head"><h3>全部借阅记录</h3></div><div class="list">${state.loans.map(item=>loanCard(item,true)).join('')}</div>`}
    function adminReminders(){const active=state.loans.filter(item=>!item.returnedAt).sort((a,b)=>daysLeft(a.dueAt)-daysLeft(b.dueAt));return`<div class="section-head"><div><h2>归还提醒</h2><p>优先处理逾期和三天内到期图书</p></div></div><div class="list">${active.map(item=>loanCard(item,true)).join('')}</div><div class="section-head"><h3>提醒记录</h3></div><div class="list">${state.reminders.slice(0,10).map(item=>`<div class="card note"><b>${esc(item.message)}</b><p>${fmt(item.sentAt)} · ${item.channel} · ${item.status}</p></div>`).join('')}</div>`}
    function adminActivities(){return`<div class="section-head"><div><h2>阅读活动</h2><p>用轻量活动鼓励持续阅读</p></div></div><form class="card admin-form" id="activityForm"><div class="field full"><label>活动名称</label><input name="title" required placeholder="例如：七日阅读挑战"></div><div class="field full"><label>活动说明</label><textarea name="detail" required placeholder="写清活动目标和规则"></textarea></div><button class="primary full">发布活动</button></form><div class="section-head"><h3>已发布活动</h3></div><div class="list">${state.activities.map(item=>`<div class="card note"><b>☆ ${esc(item.title)}</b><p>${esc(item.detail)}<br>日期：${fmt(item.date)}</p></div>`).join('')}</div>`}
    function adminManage(){return`<div class="section-head"><div><h2>会员与规则</h2><p>演示数据只保存在当前浏览器</p></div></div><div class="list">${state.members.map(item=>`<div class="card admin-row"><div><h3>${esc(item.name)}</h3><p>${item.id} · 有效期至 ${fmt(item.expiresAt)}</p></div><span class="status">会员</span></div>`).join('')}</div><div class="section-head"><h3>借阅规则</h3></div><div class="list"><div class="card setting"><div><b>最多借阅</b><small>单个会员同时借阅上限</small></div><strong>${state.settings.loanLimit} 本</strong></div><div class="card setting"><div><b>默认借期</b><small>登记后自动计算应还日期</small></div><strong>${state.settings.loanDays} 天</strong></div></div><button class="danger wide" id="resetBtn">重置全部演示数据</button>`}
    function render(){if(!state.session)return;const memberPages={首页:memberHome,借阅:memberLoans,打卡:memberCheckin,奖励:memberRewards,我的:memberProfile};const adminPages={总览:adminOverview,借阅:adminLoans,提醒:adminReminders,活动:adminActivities,管理:adminManage};$('content').innerHTML=(state.session.role==='admin'?adminPages:memberPages)[tab]();renderNav();bindPage();}
    function sendReminder(loanId){const loan=state.loans.find(item=>item.id===loanId),owner=state.members.find(item=>item.id===loan.memberId);state.reminders.unshift({id:id('rem'),memberId:loan.memberId,message:`《${loan.title}》${daysLeft(loan.dueAt)<0?'已经逾期':'即将到期'}，请及时归还。`,sentAt:dateOffset(0),status:'已送达',channel:'站内提醒'});save();toast('已向 '+owner.name+' 发送提醒');render();}
    function bindPage(){document.querySelectorAll('[data-go]').forEach(btn=>btn.onclick=()=>{tab=btn.dataset.go;render()});document.querySelectorAll('[data-minutes]').forEach(btn=>btn.onclick=()=>{minutes=Number(btn.dataset.minutes);render()});const checkBtn=$('checkinBtn');if(checkBtn)checkBtn.onclick=()=>{const book=$('checkBook').value,feeling=$('feeling').value.trim(),me=member();if(!book)return toast('请选择正在读的书');if(feeling.length<12||!/(读到|看到|书里|故事|主角|人物|觉得|喜欢|让我|想到|学到|明白)/.test(feeling))return toast('请写至少12个字，并说清读到了什么和自己的想法');state.checkins.unshift({id:id('check'),memberId:me.id,bookTitle:book,minutes,feeling,createdAt:new Date().toISOString(),checkinDay:dateOffset(0)});state.pet.food+=1;state.pet.energy=Math.min(100,state.pet.energy+6);save();toast('打卡成功，小阅收到了小鱼干！');tab='奖励';render();};document.querySelectorAll('[data-pet]').forEach(btn=>btn.onclick=()=>{const action=btn.dataset.pet;if(action==='feed'){if(state.pet.food<1)return toast('小鱼干不够，完成阅读打卡可以获得');state.pet.food-=1;state.pet.energy=Math.min(100,state.pet.energy+10);$('petSpeech').textContent='吃到啦！今天的小鱼干特别香。'}else if(action==='play'){$('petSpeech').textContent='毛线球滚起来啦！'}else $('petSpeech').textContent='呼噜呼噜，谢谢你陪我。';save();$('pet').classList.add('bounce');setTimeout(()=>$('pet')?.classList.remove('bounce'),600)});document.querySelectorAll('[data-return]').forEach(btn=>btn.onclick=()=>{const loan=state.loans.find(item=>item.id===btn.dataset.return);if(!loan||loan.returnedAt)return;loan.returnedAt=dateOffset(0);state.reminders.unshift({id:id('rem'),memberId:loan.memberId,message:`《${loan.title}》已完成归还登记。`,sentAt:dateOffset(0),status:'已送达',channel:'站内提醒'});save();toast('归还登记成功');render()});document.querySelectorAll('[data-remind]').forEach(btn=>btn.onclick=()=>sendReminder(btn.dataset.remind));const loanForm=$('loanForm');if(loanForm)loanForm.onsubmit=event=>{event.preventDefault();const form=new FormData(loanForm),days=Math.max(1,Math.min(90,Number(form.get('days'))||14));state.loans.unshift({id:id('loan'),memberId:form.get('memberId'),title:String(form.get('title')).trim(),author:String(form.get('author')).trim(),bookCode:String(form.get('bookCode')).trim(),borrowedAt:dateOffset(0),dueAt:dateOffset(days),returnedAt:null});save();toast('借阅登记成功');render()};const activityForm=$('activityForm');if(activityForm)activityForm.onsubmit=event=>{event.preventDefault();const form=new FormData(activityForm);state.activities.unshift({id:id('act'),title:String(form.get('title')).trim(),detail:String(form.get('detail')).trim(),date:dateOffset(0)});save();toast('活动已发布');render()};const resetBtn=$('resetBtn');if(resetBtn)resetBtn.onclick=()=>{if(!confirm('确定恢复初始演示数据吗？'))return;state=initialState();state.session={role:loginRole==='admin'?'admin':'member',memberId:'DEMO001'};save();tab=state.session.role==='admin'?'总览':'首页';render();toast('演示数据已重置')};}
    document.querySelector('[data-portfolio-back]').addEventListener('click',event=>{if(window.parent===window)return;event.preventDefault();window.parent.postMessage({type:'ai-lab-full-preview-nav',href:'./library-works.html'},'*')});
    if(state.session){loginRole=state.session.role;tab=state.session.role==='admin'?'总览':'首页';openApp();}
  </script>
</body>
</html>
